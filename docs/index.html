<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação</title>

  <!-- Estilo Futurista -->
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 8px #00eaff);
    }

    .logo {
      width: 200px;
    }

    .login-box {
      background: #0d1b2a;
      padding: 2rem;
      border-radius: 12px;
      box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff44;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    h1 {
      text-align: center;
      color: #00eaff;
      text-shadow: 0 0 10px #00eaff;
      margin: 0 0 1rem 0;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      border-radius: 5px;
      border: 1px solid #00eaff55;
      background-color: #0a0f1a;
      color: #ffffff;
    }

    button {
      width: 100%;
      padding: 1rem;
      background-color: #0d1b2a;
      color: #00eaff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow:
        0 0 5px #00eaff,
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 40px #00eaff55;
      transition: 0.3s ease-in-out;
    }

    button:hover {
      color: #00ffff;
      box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 30px #00eaff,
        0 0 50px #00eaff77;
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
  </div>

  <!-- Login Box -->
  <div class="login-box">
    <h1>Login</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">
    <button id="btnLogin">Entrar</button>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("btnLogin").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      signInWithEmailAndPassword(auth, email, senha)
        .then(() => {
          // Redireciona para menu.html na raiz
          window.location.href = "menu.html";
        })
        .catch(err => alert("Erro no login: " + err.message));
    });
  </script>

</body>
</html>
