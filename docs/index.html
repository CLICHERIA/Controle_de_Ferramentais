<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SGF</title>

<!-- ====================== -->
<!-- Estilo Futurista README -->
<!-- ====================== -->
<style>
  body {
    background-color: #0a0f1a;
    margin: 0;
    padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
  }
  html, body { width: 100%; height: 100%; }

  .logo-container {
    display: flex;
    justify-content: center;
    margin-top: 50px;
    filter: drop-shadow(0 0 8px #00eaff);
  }
  img.logo { width: 200px; }

  h1 {
    text-align: center;
    color: #00eaff;
    text-shadow: 0 0 20px #00eaff;
    margin-top: 20px;
  }

  .centralizado {
    text-align: center;
    margin-top: 40px;
  }

  input {
    width: 250px;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
    background-color: #0d1b2a;
    color: #00eaff;
  }
  input::placeholder { color: #66d9ff; }

  .neon-button {
    display: inline-block;
    padding: 15px 35px;
    color: #00eaff;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    border-radius: 10px;
    background-color: #0d1b2a;
    box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 40px #00eaff55;
    transition: 0.3s ease-in-out;
    cursor: pointer;
    margin-top: 20px;
  }
  .neon-button:hover {
    color: #00ffff;
    box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff, 0 0 50px #00eaff77;
  }

  .login-container {
    display: inline-block;
    background-color: #0d1b2a;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 30px #00eaff55;
  }

</style>
</head>
<body>

<!-- ====================== -->
<!-- Logo -->
<!-- ====================== -->
<div class="logo-container">
  <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
</div>

<h1>⚙️ Sistema de Gestão de Ferramentais ⚙️</h1>

<!-- ====================== -->
<!-- Formulário de Login -->
<!-- ====================== -->
<div class="centralizado">
  <div class="login-container">
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required><br>
      <input type="password" id="senha" placeholder="Senha" required><br>
      <button type="submit" class="neon-button">Login</button>
    </form>
    <p style="color:#66d9ff; margin-top:15px;">
      🔒 Apenas usuários cadastrados no sistema
    </p>
  </div>
</div>

<!-- ====================== -->
<!-- Firebase Login -->
<!-- ====================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  signInWithEmailAndPassword(auth, email, senha)
    .then(() => {
      // Redireciona para menu principal após login
      window.location.href = "menu.html";
    })
    .catch(err => {
      alert("Erro no login: " + err.message);
    });
});
</script>

</body>
</html>
