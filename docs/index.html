<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Ferramentais — Grupo Sovel</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      background-color: #0a0f1a;
      color: #e2e8f0;
    }

    header {
      text-align: center;
      margin-top: 60px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 6px 0 0 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .btn-acessar {
      background: linear-gradient(90deg, #007bff, #00bfff);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #007bff44;
      transition: all 0.3s ease;
    }

    .btn-acessar:hover {
      box-shadow: 0 0 30px #00bfff99;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      margin-bottom: 20px;
      color: #64748b;
      font-size: 0.9rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #1a1f2e;
      border-radius: 12px;
      padding: 30px;
      width: 340px;
      text-align: center;
      box-shadow: 0 0 40px #007bff33;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content h2 {
      color: #ffffff;
      margin-bottom: 20px;
    }

    .modal-content input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background-color: #0f172a;
      color: white;
      font-size: 0.95rem;
    }

    .modal-content button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, #007bff, #00bfff);
      color: white;
      box-shadow: 0 0 10px #007bff55;
      transition: 0.3s;
    }

    .modal-content button:hover {
      box-shadow: 0 0 20px #00bfff99;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 24px;
      cursor: pointer;
    }

    .close:hover {
      color: #fff;
    }

    .alt-link {
      display: block;
      margin-top: 15px;
      color: #38bdf8;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .alt-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gestão de Ferramentais</h1>
    <p>Grupo Sovel — Departamento de Amostras e Clicheria</p>
  </header>

  <main>
    <button class="btn-acessar" id="abrirModal">Acessar Menu Interativo</button>
  </main>

  <footer>
    © 2025 Grupo Sovel da Amazônia
  </footer>

  <!-- Modal de Login -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <span class="close" id="fecharModal">&times;</span>
      <h2 id="modalTitulo">Login Corporativo</h2>
      <input type="email" id="email" placeholder="E-mail corporativo" required />
      <input type="password" id="senha" placeholder="Senha" required />
      <button id="entrarBtn">Entrar</button>
      <span class="alt-link" id="alternarModo">Não tem conta? Criar conta</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    // 🔧 CONFIGURAÇÃO FIREBASE — Substitua pelos dados do seu projeto
    const firebaseConfig = {
      apiKey: "SUA_API_KEY_AQUI",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO_ID",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // === Controle do Modal ===
    const modal = document.getElementById("loginModal");
    const btn = document.getElementById("abrirModal");
    const close = document.getElementById("fecharModal");
    const entrar = document.getElementById("entrarBtn");
    const alternar = document.getElementById("alternarModo");
    const titulo = document.getElementById("modalTitulo");

    let modoCadastro = false;

    btn.onclick = () => (modal.style.display = "flex");
    close.onclick = () => (modal.style.display = "none");
    window.onclick = (e) => {
      if (e.target === modal) modal.style.display = "none";
    };

    // Alternar entre Login e Cadastro
    alternar.addEventListener("click", () => {
      modoCadastro = !modoCadastro;
      titulo.textContent = modoCadastro ? "Criar Conta" : "Login Corporativo";
      entrar.textContent = modoCadastro ? "Cadastrar" : "Entrar";
      alternar.textContent = modoCadastro
        ? "Já tem conta? Fazer login"
        : "Não tem conta? Criar conta";
    });

    // Entrar ou Criar Conta
    entrar.addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      if (!email || !senha) return alert("Preencha e-mail e senha.");

      try {
        if (modoCadastro) {
          await createUserWithEmailAndPassword(auth, email, senha);
          alert("Conta criada com sucesso! Agora faça login.");
          modoCadastro = false;
          titulo.textContent = "Login Corporativo";
          entrar.textContent = "Entrar";
          alternar.textContent = "Não tem conta? Criar conta";
        } else {
          await signInWithEmailAndPassword(auth, email, senha);
          alert("Login realizado com sucesso!");
          window.location.href = "menu.html";
        }
      } catch (error) {
        alert("Erro: " + error.message);
      }
    });
  </script>
</body>
</html>
