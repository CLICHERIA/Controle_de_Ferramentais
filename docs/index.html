<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Gestão de Ferramentais - Grupo Sovel da Amazônia" />
  <title>Gestão de Ferramentais | Grupo Sovel da Amazônia</title>

  <style>
    /* --- Estilos Gerais --- */
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #0a0f1a 0%, #020409 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeIn 1.5s ease;
    }

    header h1 {
      font-size: 2.2rem;
      color: #00aaff;
      letter-spacing: 1px;
      text-shadow: 0 0 10px #00aaff;
    }

    header p {
      color: #aaa;
      font-size: 1rem;
      margin-top: 10px;
    }

    /* --- Container de Botões --- */
    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      animation: fadeIn 2s ease;
    }

    .menu button {
      background: #0b2239;
      color: #00c3ff;
      border: 2px solid #00c3ff;
      border-radius: 10px;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 195, 255, 0.2);
    }

    .menu button:hover {
      background: #00c3ff;
      color: #0a0f1a;
      box-shadow: 0 0 25px #00c3ff;
      transform: scale(1.05);
    }

    /* --- Área de Resultados --- */
    #listaFerramentais {
      margin-top: 40px;
      background: rgba(0, 195, 255, 0.05);
      border: 1px solid rgba(0, 195, 255, 0.2);
      border-radius: 10px;
      padding: 20px 30px;
      width: 80%;
      max-width: 500px;
      box-shadow: 0 0 15px rgba(0, 195, 255, 0.1);
      display: none;
    }

    #listaFerramentais h2 {
      color: #00c3ff;
      text-align: center;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #00c3ff;
    }

    #listaFerramentais ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #listaFerramentais li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(0, 195, 255, 0.2);
    }

    /* --- Rodapé --- */
    footer {
      position: absolute;
      bottom: 15px;
      text-align: center;
      font-size: 0.9rem;
      color: #888;
    }

    footer a {
      color: #00aaff;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    footer a:hover {
      text-decoration: underline;
      color: #00eaff;
    }

    /* --- Animações --- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Responsividade --- */
    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
      .menu button { width: 80%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🔧 Sistema de Gestão de Ferramentais</h1>
    <p>Departamento de Amostras e Clicheria - Grupo Sovel da Amazônia</p>
  </header>

  <div class="menu">
    <button id="btnRegistrar">📝 Registrar Ferramental</button>
    <button id="btnListar">🔍 Consultar Ferramentais</button>
    <button onclick="alert('Gerador de QR Code em breve')">📱 Gerar QR Code</button>
    <button onclick="alert('Área administrativa em construção')">⚙️ Administração</button>
  </div>

  <div id="listaFerramentais">
    <h2>📋 Lista de Ferramentais</h2>
    <ul id="lista"></ul>
  </div>

  <footer>
    <p>&copy; 2025 Grupo Sovel da Amazônia</p>
  </footer>

  <!-- ======================= -->
  <!-- 🔥 Conexão com Firestore -->
  <!-- ======================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // ⚙️ SUA CONFIGURAÇÃO DO FIREBASE (substitua pelos seus dados reais)
    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
    authDomain: "dacsovel-53481.firebaseapp.com",
    projectId: "dacsovel-53481",
    storageBucket: "dacsovel-53481.firebasestorage.app",
    messagingSenderId: "37867522513",
    appId: "1:37867522513:web:336d687e3fc8408bd138f0"
    };

    // Inicialização
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 📝 Função para registrar novo ferramental
   async function registrarFerramental() {
  const tipo = prompt("Faca ou Clichê?:");
  const codigo = prompt("SV?:");
  const nome = prompt("Nome do Cliente?:");
  const registro = prompt("Data de Registro?:");
  const status = prompt("Status (Em uso?, danificado?, manutenção?, trocar?):");
  const responsavel = prompt("Responsável pelo registro?:");

  if (!codigo || !nome) return alert("Código e nome são obrigatórios!");

  try {
    await addDoc(collection(db, "ferramentais"), {
      codigo,
      nome,
      descricao: descricao || "",
      setor: setor || "",
      status: status || "Disponível",
      responsavel: responsavel || "Não atribuído",
      ultimaManutencao: null,
      criadoEm: new Date().toISOString()
    });
    alert("✅ Ferramental registrado com sucesso!");
  } catch (e) {
    console.error("Erro ao registrar:", e);
    alert("❌ Erro ao registrar ferramental.");
  }
}

    // 🔍 Função para listar ferramentais
    async function listarFerramentais() {
      const listaDiv = document.getElementById("listaFerramentais");
      const listaUl = document.getElementById("lista");
      listaUl.innerHTML = "";
      try {
        const querySnapshot = await getDocs(collection(db, "ferramentais"));
        if (querySnapshot.empty) {
          listaUl.innerHTML = "<li>Nenhum ferramental cadastrado.</li>";
        } else {
          querySnapshot.forEach((doc) => {
            const dados = doc.data();
            const item = document.createElement("li");
            item.textContent = `${dados.codigo} — ${dados.nome}`;
            listaUl.appendChild(item);
          });
        }
        listaDiv.style.display = "block";
      } catch (e) {
        console.error("Erro ao listar:", e);
      }
    }

    // 🎯 Eventos dos botões
    document.getElementById("btnRegistrar").addEventListener("click", registrarFerramental);
    document.getElementById("btnListar").addEventListener("click", listarFerramentais);
  </script>

</body>
</html>
