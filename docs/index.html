<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Ferramentais - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background: #fff; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
    h1 { margin-bottom: 0.5rem; }
    p { margin-top: 0; color: #666; }
    input { width: 100%; padding: 0.5rem; margin: 0.5rem 0; border-radius: 5px; border: 1px solid #ccc; }
    button { width: 100%; padding: 0.7rem; margin-top: 1rem; background: #007BFF; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .alternar { margin-top: 1rem; color: #007BFF; cursor: pointer; text-decoration: underline; }
    .autenticacao { color: #333; font-weight: 600; margin-bottom: 1rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gestão de Ferramentais</h1>
    <p>Grupo Sovel — Departamento de Amostras e Clicheria</p>
    <div class="autenticacao">Autenticação</div>

    <h2 id="titulo">Login Corporativo</h2>
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button id="entrar">Entrar</button>
    <div class="alternar" id="alternar">Não tem conta? Criar conta</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO_ID",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const entrar = document.getElementById("entrar");
    const alternar = document.getElementById("alternar");
    const titulo = document.getElementById("titulo");
    let modoCadastro = false;

    // Redireciona se usuário já estiver logado
    onAuthStateChanged(auth, user => {
      if (user) window.location.href = "menu.html";
    });

    alternar.addEventListener("click", () => {
      modoCadastro = !modoCadastro;
      if (modoCadastro) {
        titulo.textContent = "Criar Conta";
        entrar.textContent = "Cadastrar";
        alternar.textContent = "Já tem conta? Fazer login";
      } else {
        titulo.textContent = "Login Corporativo";
        entrar.textContent = "Entrar";
        alternar.textContent = "Não tem conta? Criar conta";
      }
    });

    entrar.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!email || !senha) return alert("Preencha e-mail e senha.");

      try {
        if (modoCadastro) {
          await createUserWithEmailAndPassword(auth, email, senha);
          alert("Conta criada com sucesso! Agora faça login.");
          modoCadastro = false;
          titulo.textContent = "Login Corporativo";
          entrar.textContent = "Entrar";
          alternar.textContent = "Não tem conta? Criar conta";
        } else {
          await signInWithEmailAndPassword(auth, email, senha);
          window.location.href = "menu.html";
        }
      } catch (error) {
        alert("Erro: " + error.message);
      }
    });
  </script>

</body>
</html>
