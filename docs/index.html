<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Ferramentais — Grupo Sovel</title>
  <meta name="description" content="Página de acesso ao sistema de gestão de ferramentais do Grupo Sovel." />
  
  <!-- Tipografia Moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #0e1620;
      --bg-modal: linear-gradient(135deg, #071827, #0a2630);
      --text-primary: #e6eef6;
      --text-muted: #99a3ad;
      --accent-primary: #1e88e5;
      --accent-secondary: #0ea5a4;
      --accent-hover: #0fb6c6;
      --shadow-light: rgba(30, 136, 229, 0.1);
      --shadow-medium: rgba(30, 136, 229, 0.2);
      --shadow-strong: rgba(30, 136, 229, 0.4);
      --border-radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* Background animado */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 80%, rgba(30,136,229,0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(14,166,164,0.1) 0%, transparent 50%);
      z-index: -1;
      animation: backgroundShift 20s ease-in-out infinite alternate;
    }

    @keyframes backgroundShift {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    header {
      text-align: center;
      margin-top: 4rem;
      width: 100%;
      max-width: 600px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 1.125rem;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.5;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .btn-acessar {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #021018;
      border: none;
      padding: 1rem 2.5rem;
      font-size: 1.125rem;
      font-weight: 600;
      border-radius: var(--border-radius);
      cursor: pointer;
      box-shadow: 0 10px 25px var(--shadow-medium);
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: relative;
      overflow: hidden;
    }

    .btn-acessar::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn-acessar:hover::before {
      left: 100%;
    }

    .btn-acessar:hover {
      box-shadow: 0 15px 35px var(--shadow-strong);
      transform: translateY(-3px);
    }

    footer {
      text-align: center;
      margin-bottom: 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal-content {
      background: var(--bg-modal);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      animation: modalFadeIn 0.4s ease-out;
      position: relative;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.9) translateY(-20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-content h2 {
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.9rem;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
      color: var(--text-muted);
    }

    .modal-content input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background-color: rgba(8, 22, 27, 0.8);
      color: var(--text-primary);
      font-size: 1rem;
      transition: var(--transition);
      outline: none;
    }

    .modal-content input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--shadow-light);
      background-color: rgba(8, 22, 27, 1);
    }

    .modal-content button {
      margin-top: 1.5rem;
      padding: 0.875rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #021018;
      box-shadow: 0 5px 15px var(--shadow-medium);
      transition: var(--transition);
      font-size: 1rem;
      width: 100%;
    }

    .modal-content button:hover {
      box-shadow: 0 8px 25px var(--shadow-strong);
      transform: translateY(-2px);
    }

    .close {
      color: var(--text-muted);
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      cursor: pointer;
      transition: var(--transition);
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .close:hover {
      color: var(--text-primary);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .alt-link {
      display: block;
      margin-top: 1.5rem;
      color: var(--accent-primary);
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
      text-decoration: none;
    }

    .alt-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    /* Responsividade */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }
      header p {
        font-size: 1rem;
      }
      .btn-acessar {
        padding: 0.875rem 2rem;
        font-size: 1rem;
      }
      .modal-content {
        width: 90%;
        padding: 2rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      header {
        margin-top: 2rem;
      }
      header h1 {
        font-size: 1.75rem;
      }
      .modal-content {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Gestão de Ferramentais</h1>
    <p>Grupo Sovel — Departamento de Amostras e Clicheria</p>
  </header>

  <main>
    <button class="btn-acessar" id="abrirModal" aria-haspopup="dialog" aria-controls="loginModal">
      Acessar Menu Interativo
    </button>
  </main>

  <footer>
    © 2025 Grupo Sovel da Amazônia
  </footer>

  <!-- Modal de Login -->
  <div id="loginModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-content">
      <button class="close" id="fecharModal" aria-label="Fechar modal">&times;</button>
      <h2 id="modalTitulo">Login Corporativo</h2>

      <label for="email">E-mail corporativo</label>
      <input type="email" id="email" placeholder="seu.email@sovel.com.br" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required />

      <button id="entrarBtn">Entrar</button>
      <span class="alt-link" id="alternarModo">Não tem conta? Criar conta</span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "SUA_API_KEY_AQUI",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO_ID",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const modal = document.getElementById("loginModal");
    const btn = document.getElementById("abrirModal");
    const close = document.getElementById("fecharModal");
    const entrar = document.getElementById("entrarBtn");
    const alternar = document.getElementById("alternarModo");
    const titulo = document.getElementById("modalTitulo");

    let modoCadastro = false;

    btn.onclick = () => modal.style.display = "flex";
    close.onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

    alternar.addEventListener("click", () => {
      modoCadastro = !modoCadastro;
      titulo.textContent = modoCadastro ? "Criar Conta" : "Login Corporativo";
      entrar.textContent = modoCadastro ? "Cadastrar" : "Entrar";
      alternar.textContent = modoCadastro
        ? "Já tem conta? Fazer login"
        : "Não tem conta? Criar conta";
    });

    entrar.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();

      if (!email || !senha) return alert("Preencha e-mail e senha.");

      try {
        if (modoCadastro) {
          await createUserWithEmailAndPassword(auth, email, senha);
          alert("Conta criada com sucesso! Agora faça login.");
          modoCadastro = false;
          titulo.textContent = "Login Corporativo";
          entrar.textContent = "Entrar";
          alternar.textContent = "Não tem conta? Criar conta";
        } else {
          await signInWithEmailAndPassword(auth, email, senha);
          alert("Login realizado com sucesso!");
          window.location.href = "menu.html";
        }
      } catch (error) {
        alert("Erro: " + error.message);
      }
    });
  </script>
</body>
</html>
