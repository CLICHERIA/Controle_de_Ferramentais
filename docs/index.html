<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema de Gestão de Ferramentais</title>

<!-- ====================== -->
<!-- Estilo Futurista -->
<!-- ====================== -->
<style>
  body {
    background-color: #0a0f1a;
    margin: 0;
    padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
  }

  html, body {
    width: 100%;
    height: 100%;
  }

  a {
    color: #00eaff;
    text-decoration: none;
  }

  .logo-container {
    display: block;
    margin: 40px auto 20px auto;
    text-align: center;
    filter: drop-shadow(0 0 8px #00eaff);
  }

  img.logo {
    max-width: 200px;
  }

  .login-box {
    background-color: #0d1b2a;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 30px #00eaff55;
    width: 300px;
    margin: 0 auto;
    text-align: center;
  }

  .login-box input {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    background-color: #0a0f1a;
    color: #00eaff;
    box-shadow: 0 0 5px #00eaff55 inset;
  }

  .neon-button {
    display: inline-block;
    padding: 12px 25px;
    margin-top: 15px;
    color: #00eaff;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    border-radius: 10px;
    background-color: #0d1b2a;
    box-shadow:
      0 0 5px #00eaff,
      0 0 10px #00eaff,
      0 0 20px #00eaff,
      0 0 40px #00eaff55;
    transition: 0.3s ease-in-out;
    animation: neonPulse 1.5s infinite alternate;
    border: none;
    cursor: pointer;
  }

  .neon-button:hover {
    color: #00ffff;
    box-shadow:
      0 0 10px #00eaff,
      0 0 20px #00eaff,
      0 0 30px #00eaff,
      0 0 50px #00eaff77;
  }

  @keyframes neonPulse {
    0%, 100% {
      box-shadow:
        0 0 5px #00eaff,
        0 0 10px #00eaff,
        0 0 20px #00eaff;
    }
    50% {
      box-shadow:
        0 0 15px #00eaff,
        0 0 30px #00eaff,
        0 0 45px #00eaff77;
    }
  }

  .top-right-info {
    position: absolute;
    top: 20px;
    right: 30px;
    text-align: right;
    color: #00eaff;
    font-size: 14px;
  }
</style>

<!-- Firebase SDKs -->
<script type="module">
  // Importa o Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

  // Config do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function() {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    if (!email || !senha) {
      alert("Preencha todos os campos!");
      return;
    }

    signInWithEmailAndPassword(auth, email, senha)
      .then((userCredential) => {
        // Salva usuário no sessionStorage
        sessionStorage.setItem("usuario", email);

        // Redireciona para menu na raiz do projeto
        window.location.href = "/SGF/menu.html";
      })
      .catch(err => {
        alert("Erro no login: " + err.message);
      });
  }
</script>

</head>
<body>

  <!-- Top Right Info Placeholder -->
  <div class="top-right-info">
    <!-- Será preenchido após login, se necessário -->
  </div>

  <!-- Logo -->
  <div class="logo-container">
    <img src="../logosovel1337.png" alt="Logo Grupo Sovel da Amazônia" class="logo">
  </div>

  <!-- Caixa de Login -->
  <div class="login-box">
    <h2 style="color:#00eaff; margin-bottom:20px;">Login</h2>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="senha" placeholder="Senha"><br>
    <button class="neon-button" onclick="login()">Entrar</button>
  </div>

</body>
</html>
