<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #0d1b2a;
      padding: 2rem;
      border-radius: 15px;
      box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff55;
      width: 350px;
      text-align: center;
    }

    .logo-container {
      display: inline-block;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 10px #00eaff);
    }

    .logo {
      display: block;
      margin: 0 auto;
      width: 150px;
      height: auto;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #00eaff;
      background: #0a0f1a;
      color: #00eaff;
      font-size: 1rem;
    }

    input::placeholder {
      color: #00eaffaa;
    }

    button {
      width: 100%;
      padding: 1rem;
      background-color: #0d1b2a;
      color: #00eaff;
      border: 2px solid #00eaff;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease-in-out;
      box-shadow:
        0 0 5px #00eaff,
        0 0 10px #00eaff,
        0 0 20px #00eaff;
      animation: neonPulse 1.5s infinite alternate;
    }

    button:hover {
      color: #00ffff;
      box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 40px #00eaff;
    }

    @keyframes neonPulse {
      0%, 100% {
        box-shadow:
          0 0 5px #00eaff,
          0 0 10px #00eaff,
          0 0 20px #00eaff;
      }
      50% {
        box-shadow:
          0 0 15px #00eaff,
          0 0 30px #00eaff,
          0 0 45px #00eaff77;
      }
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
  </div>
  <h1>Autenticação</h1>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">
  <button id="btnLogin">Entrar</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById("btnLogin").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    signInWithEmailAndPassword(auth, email, senha)
      .then(() => {
        // Redireciona para menu.html dentro da pasta docs
        window.location.href = "docs/menu.html";
      })
      .catch(err => alert("Erro no login: " + err.message));
  });
</script>

</body>
</html>
