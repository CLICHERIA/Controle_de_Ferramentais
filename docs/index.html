<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação</title>

  <!-- ====================== -->
  <!-- Estilo futurista do README -->
  <!-- ====================== -->
  <style>
    body {
      background-color: #0a0f1a;
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #0d1b2a;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 20px #00eaff55;
      width: 350px;
      text-align: center;
    }

    .logo-container {
      display: inline-block;
      background: transparent;
      padding: 0;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 8px #00eaff);
    }

    .logo-container img {
      width: 180px;
      display: block;
      margin: 0 auto;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 5px;
      border: 1px solid #00eaff44;
      background-color: #0a0f1a;
      color: #00eaff;
      font-size: 1rem;
    }

    input::placeholder {
      color: #00eaff88;
    }

    .neon-button {
      display: inline-block;
      padding: 12px 25px;
      color: #00eaff;
      font-weight: bold;
      border-radius: 10px;
      background-color: #0d1b2a;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 40px #00eaff55;
      cursor: pointer;
      transition: 0.3s ease-in-out;
      text-decoration: none;
      font-size: 16px;
    }

    .neon-button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff, 0 0 50px #00eaff77;
    }

    p {
      margin-top: 1rem;
      font-size: 14px;
    }

    a {
      color: #00eaff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo-container">
    <img src="../logosovel1337.png" alt="Logo Grupo Sovel">
  </div>

  <h2>Autenticação</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">

  <button class="neon-button" id="btnLogin">Entrar</button>

  <p>Não tem conta? <a href="#" id="btnCadastrar">Cadastrar</a></p>
</div>

<!-- ====================== -->
<!-- Firebase -->
<!-- ====================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Login
  document.getElementById("btnLogin").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    signInWithEmailAndPassword(auth, email, senha)
      .then(() => {
        // Após login, redireciona para menu.html que está na raiz
        window.location.href = "../menu.html";
      })
      .catch(err => alert("Erro no login: " + err.message));
  });

  // Cadastro
  document.getElementById("btnCadastrar").addEventListener("click", () => {
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    createUserWithEmailAndPassword(auth, email, senha)
      .then(() => alert("Conta criada! Faça login."))
      .catch(err => alert("Erro ao cadastrar: " + err.message));
  });
</script>

</body>
</html>
