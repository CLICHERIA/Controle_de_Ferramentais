<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Gestão de Ferramentais - Grupo Sovel da Amazônia" />
  <title>Gestão de Ferramentais | Grupo Sovel da Amazônia</title>
  <style>
    /* --- Estilos Gerais --- */
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #0a0f1a 0%, #020409 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeIn 1.5s ease;
    }

    header h1 {
      font-size: 2.2rem;
      color: #00aaff;
      letter-spacing: 1px;
      text-shadow: 0 0 10px #00aaff;
    }

    header p {
      color: #aaa;
      font-size: 1rem;
      margin-top: 10px;
    }

    /* --- Container de Botões --- */
    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      animation: fadeIn 2s ease;
    }

    .menu button {
      background: #0b2239;
      color: #00c3ff;
      border: 2px solid #00c3ff;
      border-radius: 10px;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 195, 255, 0.2);
    }

    .menu button:hover {
      background: #00c3ff;
      color: #0a0f1a;
      box-shadow: 0 0 25px #00c3ff;
      transform: scale(1.05);
    }

    /* --- Rodapé Minimalista --- */
    footer {
      position: absolute;
      bottom: 15px;
      text-align: center;
      font-size: 0.9rem;
      color: #888;
    }

    footer a {
      color: #00aaff;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    footer a:hover {
      text-decoration: underline;
      color: #00eaff;
    }

    /* --- Animações --- */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- Responsividade --- */
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.6rem;
      }
      .menu button {
        width: 80%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🔧 Sistema de Gestão de Ferramentais</h1>
    <p>Departamento de Amostras e Clicheria - Grupo Sovel da Amazônia</p>
  </header>

  <div class="menu">
    <button onclick="alert('Página de Registro em desenvolvimento')">📝 Registrar Ferramental</button>
    <button onclick="alert('Consulta em desenvolvimento')">🔍 Consultar Ferramentais</button>
    <button onclick="alert('Gerador de QR Code em breve')">📱 Gerar QR Code</button>
    <button onclick="alert('Área administrativa em construção')">⚙️ Administração</button>
  </div>

  <footer>
    <p>
      &copy; 2025 Grupo Sovel da Amazônia • 
      <a href="../README.md" target="_blank">Leia o README</a>
    </p>
  </footer>

</body>
</html>
