<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: #0d1b2a;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px #00eaff44;
      width: 320px;
      text-align: center;
    }
    .login-box img {
      display: block;
      margin: 0 auto 20px auto;
      width: 150px;
      filter: drop-shadow(0 0 8px #00eaff);
    }
    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 5px;
      border: 1px solid #00eaff44;
      background: #0a0f1a;
      color: #00eaff;
      font-size: 1rem;
    }
    input::placeholder {
      color: #00eaff77;
    }
    button {
      width: 100%;
      padding: 1rem;
      background-color: #0d1b2a;
      color: #00eaff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
      transition: 0.3s ease-in-out;
      font-size: 1rem;
    }
    button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff;
    }
    p {
      margin-top: 1rem;
    }
    a {
      color: #00eaff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel">
    <h1>Autenticação</h1>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">
    <button id="btnLogin">Entrar</button>
    <p>Contato admin: <a href="mailto:dac@sovel.com.br">dac@sovel.com.br</a></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("btnLogin").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      signInWithEmailAndPassword(auth, email, senha)
        .then(() => { 
          // Redireciona diretamente para menu na raiz
          window.location.href = "menu.html"; 
        })
        .catch(err => alert("Erro no login: " + err.message));
    });
  </script>
</body>
</html>
