<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SGF</title>

  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .logo-container {
      margin-bottom: 40px;
      filter: drop-shadow(0 0 8px #00eaff);
    }

    img.logo {
      width: 200px;
      display: block;
      margin: 0 auto;
    }

    form {
      background-color: #0d1b2a;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00eaff22;
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 300px;
    }

    input[type="email"], input[type="password"] {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .neon-button {
      padding: 12px;
      font-weight: bold;
      color: #00eaff;
      background-color: #0d1b2a;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
      transition: 0.3s ease-in-out;
    }

    .neon-button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="../logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
  </div>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Senha" required>
    <button type="submit" class="neon-button">Login</button>
  </form>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          // Redireciona para menu na raiz
          window.location.href = "/SGF/menu.html";
        })
        .catch((error) => {
          alert("Erro no login: " + error.message);
        });
    });
  </script>

</body>
</html>
