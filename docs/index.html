<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestão - Login</title>

<!-- ====================== -->
<!-- Estilo Neon Futurista -->
<!-- ====================== -->
<style>
body {
    background-color: #0a0f1a;
    margin: 0; padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
}

h1 { color: #00eaff; text-shadow: 0 0 20px #00eaff; margin-top: 40px; text-align:center; }

.logo-container {
    display: inline-block;
    background: transparent;
    padding: 0;
    margin: 20px;
    filter: drop-shadow(0 0 8px #00eaff);
}

img.logo { display: block; margin: 0 auto; }

form {
    display: flex; flex-direction: column; align-items: center;
    background: #0d1b2a;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 20px #00eaff33;
    margin-top: 20px;
}

input {
    padding: 12px;
    margin: 10px 0;
    width: 250px;
    border-radius: 10px;
    border: 1px solid #00eaff;
    background-color: #0a0f1a;
    color: #00eaff;
}

input::placeholder { color: #66d9ff; }

button {
    padding: 12px 20px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background-color: #0d1b2a;
    color: #00eaff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
    transition: 0.3s ease-in-out;
}

button:hover {
    color: #00ffff;
    box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff;
}

.error { color: #ff5555; margin-top: 10px; }
</style>

<!-- ====================== -->
<!-- Firebase SDK -->
<!-- ====================== -->
<script type="module">
  // Importando módulos Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;
    const erro = document.getElementById("erro");

    signInWithEmailAndPassword(auth, email, senha)
      .then((userCredential) => {
        // Login bem-sucedido → redirecionar para docs/index.html
        window.location.href = "docs/index.html";
      })
      .catch((error) => {
        erro.textContent = "Erro no login: " + error.message;
      });
  };
</script>
</head>

<body>

<div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" width="200" class="logo">
</div>

<h1>⚙️ Sistema de Gestão de Ferramentais ⚙️</h1>

<form onsubmit="login(event)">
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button type="submit">Entrar</button>
    <div id="erro" class="error"></div>
</form>

</body>
</html>
