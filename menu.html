<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Menu SGF</title>
<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center;}
.centralizado { width:400px; margin:100px auto; background:#222; padding:30px; border-radius:10px;}
button { width:90%; padding:12px; margin:10px 0; border:none; border-radius:5px; background:#00bfff; color:#111; font-weight:bold; cursor:pointer;}
button:hover { background:#00e0ff; }
img.logo { width:200px; margin-bottom:30px; display:block; margin-left:auto; margin-right:auto; }
</style>
</head>
<body>

<div class="centralizado">
    <img src="logosovel1337.png" alt="Logo" class="logo">
    <h2>Menu Principal SGF</h2>
    <button onclick="window.location.href='registrar.html'">Registrar Ferramental</button>
    <button onclick="window.location.href='consultar.html'">Consultar Ferramentais</button>
    <button onclick="logout()">Sair</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script>
// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
firebase.initializeApp(firebaseConfig);

function logout(){
    firebase.auth().signOut().then(()=>{
        window.location.href = "index.html";
    });
}

firebase.auth().onAuthStateChanged(user=>{
    if(!user){
        window.location.href = "index.html";
    }
});
</script>

</body>
</html>
