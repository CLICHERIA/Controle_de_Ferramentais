<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Sistema de Gestão</title>

<style>
body {
    background-color: #0a0f1a;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    margin:0; padding:0;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo-container {
    margin-top: 40px; /* espaço do topo */
    text-align: center;
    filter: drop-shadow(0 0 10px #00eaff);
    animation: logoPulse 2s infinite alternate;
}

img.logo {
    width: 200px;
    height: auto;
    display: block;
    margin: 0 auto;
}

@keyframes logoPulse {
    0% {
        filter: drop-shadow(0 0 10px #00eaff);
    }
    50% {
        filter: drop-shadow(0 0 25px #00eaff), drop-shadow(0 0 40px #00eaff55);
    }
    100% {
        filter: drop-shadow(0 0 10px #00eaff);
    }
}

h1 {
    text-align:center;
    color:#00eaff;
    text-shadow:0 0 20px #00eaff;
    margin: 20px 0 40px 0;
}

.container {
    display:flex; 
    flex-direction:column; 
    align-items:center;
}

.neon-button {
    display:inline-block;
    padding:15px 35px;
    margin:10px;
    color:#00eaff;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
    border-radius:10px;
    background-color:#0d1b2a;
    box-shadow: 0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff,0 0 40px #00eaff55;
    transition:0.3s ease-in-out;
    animation: neonPulse 1.5s infinite alternate;
}

.neon-button:hover {
    color:#00ffff;
    box-shadow:0 0 10px #00eaff,0 0 20px #00eaff,0 0 30px #00eaff,0 0 50px #00eaff77;
}

@keyframes neonPulse {
    0%,100% { box-shadow:0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff; }
    50% { box-shadow:0 0 15px #00eaff,0 0 30px #00eaff,0 0 45px #00eaff77; }
}
</style>
</head>
<body>

<div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
</div>

<h1>Menu Principal</h1>

<div class="container">
    <a href="registrar.html" class="neon-button">📋 Registrar Ferramenta</a>
    <a href="consultar.html" class="neon-button">🔍 Consultar Ferramenta</a>
    <a href="docs/index.html" class="neon-button">🏠 Voltar ao Painel Interativo</a>
</div>

</body>
</html>
