<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Interativo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Orbitron', sans-serif;
    color: #fff;
  }

  .menu-box {
    background: rgba(0,0,0,0.85);
    padding: 3rem;
    border-radius: 12px;
    box-shadow: 0 0 20px #00f0ff, 0 0 40px #ff00ff inset;
    text-align: center;
  }

  h1 {
    margin-bottom: 2rem;
    color: #00f0ff;
    text-shadow: 0 0 10px #00f0ff;
  }

  a {
    display: block;
    margin: 1rem 0;
    padding: 1rem;
    background: linear-gradient(90deg, #00f0ff, #ff00ff);
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    border-radius: 8px;
    transition: 0.3s;
  }

  a:hover {
    box-shadow: 0 0 20px #ff00ff, 0 0 40px #00f0ff;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<div class="menu-box">
  <h1>Menu Interativo</h1>
  <a href="registrar.html">Registrar Ferramental</a>
  <a href="consultar.html">Consultar Ferramental</a>
  <a href="workflows/index.html">Sair / Logout</a>
</div>

</body>
</html>
