<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Sistema de Gestão</title>

<style>
body {
    background-color: #0a0f1a;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    margin:0; padding:0;
}

.logo-container {
    display: inline-block;
    padding: 20px;
    margin: 20px auto;
    text-align:center;
    filter: drop-shadow(0 0 8px #00eaff);
}

img.logo { display:block; margin:0 auto; }

h1 { text-align:center; color:#00eaff; text-shadow:0 0 20px #00eaff; }

.container {
    display:flex; flex-direction:column; align-items:center;
    margin-top:30px;
}

.neon-button {
    display:inline-block;
    padding:15px 35px;
    margin:10px;
    color:#00eaff;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
    border-radius:10px;
    background-color:#0d1b2a;
    box-shadow: 0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff,0 0 40px #00eaff55;
    transition:0.3s ease-in-out;
    animation: neonPulse 1.5s infinite alternate;
}

.neon-button:hover {
    color:#00ffff;
    box-shadow:0 0 10px #00eaff,0 0 20px #00eaff,0 0 30px #00eaff,0 0 50px #00eaff77;
}

@keyframes neonPulse {
    0%,100% { box-shadow:0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff; }
    50% { box-shadow:0 0 15px #00eaff,0 0 30px #00eaff,0 0 45px #00eaff77; }
}
</style>
</head>
<body>

<div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" width="200" class="logo">
</div>

<h1>Menu Principal</h1>

<div class="container">
    <a href="registrar.html" class="neon-button">📋 Registrar Ferramenta</a>
    <a href="consultar.html" class="neon-button">🔍 Consultar Ferramenta</a>
    <a href="docs/index.html" class="neon-button">🏠 Voltar ao Painel Interativo</a>
</div>

</body>
</html>
