<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Gestão de Ferramentais</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #0e1620;
      --text-primary: #e6eef6;
      --text-muted: #99a3ad;
      --accent-primary: #1e88e5;
      --accent-secondary: #0ea5a4;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
    }

    header h1 {
      font-size: 2.3rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-top: 0.5rem;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      width: 100%;
      padding: 2rem;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      color: #021018;
      font-weight: 600;
      padding: 1rem 2.5rem;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: var(--transition);
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      width: 280px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .logout-btn {
      margin-top: 3rem;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--text-muted);
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 1.5rem 0;
      width: 100%;
      background-color: #0b121e;
    }
  </style>
</head>
<body>
  <header>
    <h1>Menu Principal</h1>
    <p>Gestão de Ferramentais — Grupo Sovel</p>
  </header>

  <main>
    <button class="btn" onclick="window.location.href='registrar.html'">Registrar Ferramental</button>
    <button class="btn" onclick="window.location.href='consultar.html'">Consultar Ferramental</button>

    <button class="btn logout-btn" id="logoutBtn">Sair</button>
  </main>

  <footer>© 2025 Grupo Sovel da Amazônia</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
