<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Ferramental</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #00eaff; text-shadow: 0 0 5px #00eaff; }
    .detalhes {
      background-color: #0d1b2a;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 20px #00eaff22;
      max-width: 500px;
      width: 100%;
    }
    .detalhes p { margin: 10px 0; }
    .detalhes strong { color: #00ffff; }
  </style>
</head>
<body>
<h1>Detalhes do Ferramental</h1>
<div class="detalhes" id="detalhes"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.appspot.com",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const detalhesDiv = document.getElementById("detalhes");

// Pega ID da URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

async function carregarDetalhes() {
  if(!id) {
    detalhesDiv.innerHTML = "<p>ID do ferramental não informado!</p>";
    return;
  }
  try {
    const snapshot = await get(child(ref(db), `ferramentais/${id}`));
    if(!snapshot.exists()) {
      detalhesDiv.innerHTML = "<p>Ferramental não encontrado!</p>";
      return;
    }
    const item = snapshot.val();
    detalhesDiv.innerHTML = `
      <p><strong>Tipo:</strong> ${item.tipo}</p>
      <p><strong>NF-e:</strong> ${item.nfe}</p>
      <p><strong>SV:</strong> ${item.sv}</p>
      <p><strong>Nome:</strong> ${item.nome}</p>
      <p><strong>Data Registro:</strong> ${item.dataRegistro}</p>
      <p><strong>Estado:</strong> ${item.estado}</p>
      <p><strong>Localização:</strong> ${item.localizacao}</p>
      <p><strong>Responsável:</strong> ${item.responsavel}</p>
    `;
  } catch(err) {
    detalhesDiv.innerHTML = "<p>Erro ao carregar detalhes.</p>";
    console.error(err);
  }
}

carregarDetalhes();
</script>
</body>
</html>
