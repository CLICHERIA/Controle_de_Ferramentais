<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Consulta de Ferramentais — SGF</title>
  <style>
    :root{
      --bg:#0a0f1a; --panel:#0f1720; --neon:#00eaff; --neon-weak:#00eaff33;
      --text:#dff7ff; --muted:#98cfe0;
    }
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",sans-serif}
    .page { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:36px 16px; box-sizing:border-box; }
    h1{ color:var(--neon); text-shadow:0 0 14px #00eaff66; margin:6px 0 22px; font-size:30px; font-weight:700; }
    .container{ width:92%; max-width:1100px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.005)); border-radius:16px; padding:22px; box-shadow:0 0 28px var(--neon-weak); border:1px solid rgba(0,234,255,0.04); }
    .status-bar { width:100%; max-width:680px; margin:0 auto 16px; padding:10px 14px; border-radius:10px; text-align:center; font-weight:600; display:none; box-shadow:0 0 12px rgba(0,234,255,0.08); }
    .controls{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center; margin-bottom:16px; }
    .controls input[type="text"]{ width:260px; padding:10px 12px; border-radius:10px; background:#071018; border:1px solid rgba(0,234,255,0.14); color:var(--text); outline:none; text-align:center; }
    .btn { background:transparent; border:1px solid rgba(0,234,255,0.25); color:var(--neon); padding:10px 16px; border-radius:10px; cursor:pointer; font-weight:700; box-shadow:0 0 10px rgba(0,234,255,0.06); transition:all .15s ease; }
    .btn:hover{ background: rgba(0,234,255,0.06); transform:translateY(-2px); }
    table{ width:100%; border-collapse:collapse; margin-top:12px; table-layout:fixed; word-wrap:break-word; }
    thead th{ background:rgba(0,234,255,0.06); color:var(--neon); padding:12px; text-align:left; font-weight:700; }
    tbody td { padding:12px; border-top:1px solid rgba(0,234,255,0.03); color:var(--text); font-size:14px; }
    tbody tr:hover{ background:rgba(0,234,255,0.03); }
    .qrcode-wrap{ margin-top:20px; text-align:center; }
    .qrcode-wrap img, .qrcode-wrap canvas{ background:var(--bg); border-radius:10px; padding:8px; border:2px solid #fff; }
    @media (max-width:720px){ .controls input[type="text"]{ width:200px; } thead th, tbody td{ font-size:13px; padding:10px; } }
  </style>
</head>
<body>
  <div class="page">
    <h1>Consulta de Ferramentais — Grupo Sovel</h1>

    <div class="container">
      <div id="statusBar" class="status-bar" aria-live="polite"></div>

      <div class="controls">
        <input id="svInput" type="text" placeholder="Digite o número da SV (opcional)">
        <button id="btnBuscar" class="btn">Consultar</button>
        <button id="btnGerarQR" class="btn">Gerar QR-Code</button>
        <button id="btnExport" class="btn">Exportar</button>
        <button id="btnMenu" class="btn">Retornar ao Menu</button>
      </div>

      <div style="overflow:auto">
        <table id="tabelaFerramentais" aria-live="polite">
          <thead>
            <tr>
              <th style="width:18%">SV</th>
              <th style="width:24%">Tipo</th>
              <th style="width:38%">Nome / Cliente</th>
              <th style="width:20%">Status</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo"></tbody>
        </table>
      </div>

      <div class="qrcode-wrap" id="qrcodeWrap" aria-hidden="true"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- MÓDULO PRINCIPAL: tenta usar seu db; exporta funções para window -->
  <script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const svInput = document.getElementById('svInput');
    const tabelaCorpo = document.getElementById('tabelaCorpo');
    const statusBar = document.getElementById('statusBar');
    const qrcodeWrap = document.getElementById('qrcodeWrap');

    function mostrarStatus(text, color = '#00eaff', autoHide = true) {
      statusBar.style.display = 'block';
      statusBar.style.color = color;
      statusBar.style.borderColor = color;
      statusBar.textContent = text;
      if (autoHide) {
        clearTimeout(statusBar._hideTimer);
        statusBar._hideTimer = setTimeout(() => statusBar.style.display = 'none', 4500);
      }
    }

    function limparTabela() { tabelaCorpo.innerHTML = ''; }

    async function buscarFerramentais() {
      limparTabela();
      qrcodeWrap.innerHTML = '';
      const termo = svInput.value.trim().toUpperCase();
      mostrarStatus('🔍 Buscando dados...', '#00eaff', false);

      try {
        const colRef = collection(db, 'ferramentais');
        let snap;
        if (termo) {
          const q = query(colRef, where('sv', '==', termo));
          snap = await getDocs(q);
        } else {
          snap = await getDocs(colRef);
        }

        if (snap.empty) {
          mostrarStatus('⚠️ Nenhum resultado encontrado.', '#ff8a80');
          tabelaCorpo.innerHTML = `<tr><td colspan="4" style="color:#ff8a80;padding:14px;text-align:center">Nenhum resultado encontrado.</td></tr>`;
          return;
        }

        let rowsHtml = '';
        snap.forEach(doc => {
          const d = doc.data();
          const sv = d.sv || '-';
          const tipo = d.tipo || '-';
          const nome = (d.nome || d.cliente || '-');
          const status = d.estado || d.status || '-';
          rowsHtml += `<tr data-sv="${sv}"><td>${sv}</td><td>${tipo}</td><td style="text-align:left">${escapeHtml(nome)}</td><td>${status}</td></tr>`;
        });

        tabelaCorpo.innerHTML = rowsHtml;
        mostrarStatus('✅ Resultados carregados com sucesso.', '#7ef2ff');
      } catch (err) {
        console.error('Erro buscarFerramentais:', err);
        mostrarStatus('❌ Erro ao buscar dados. Veja console.', '#ff8a80');
        tabelaCorpo.innerHTML = `<tr><td colspan="4" style="color:#ff8a80;padding:14px;text-align:center">Erro ao buscar dados.</td></tr>`;
      }
    }

    function gerarQRCode() {
      const valor = svInput.value.trim().toUpperCase();
      if (!valor) { mostrarStatus('⚠️ Digite uma SV para gerar o QR-Code.', '#ffd67a'); return; }
      qrcodeWrap.innerHTML = ''; qrcodeWrap.setAttribute('aria-hidden','false');
      new QRCode(qrcodeWrap, {
        text: `${window.location.origin}/docs/detalhes.html?id=${encodeURIComponent(valor)}`,
        width: 200, height: 200, colorDark: "#ffffff", colorLight: "#0a0f1a", correctLevel: QRCode.CorrectLevel.H
      });
      setTimeout(()=> {
        const node = qrcodeWrap.querySelector('img') || qrcodeWrap.querySelector('canvas');
        if(node) node.style.boxShadow = '0 0 18px rgba(0,234,255,0.08)';
      },120);
      mostrarStatus('✅ QR-Code gerado. Escaneie para abrir detalhes.', '#7ef2ff');
    }

    function exportar() {
      const img = qrcodeWrap.querySelector('img') || qrcodeWrap.querySelector('canvas');
      if (img) {
        let dataUrl = (img.tagName.toLowerCase() === 'canvas') ? img.toDataURL('image/png') : img.src;
        const a = document.createElement('a'); a.href = dataUrl; a.download = `QRCode_${(svInput.value||'SV').replace(/\s/g,'_')}.png`; document.body.appendChild(a); a.click(); a.remove();
        mostrarStatus('📥 QR-Code exportado.', '#7ef2ff');
        return;
      }
      const tabela = document.getElementById('tabelaFerramentais').outerHTML;
      const newWin = window.open('', '_blank');
      newWin.document.write(`<html><head><title>Relatório - SGF</title><style>body{font-family:Segoe UI,sans-serif;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #111;padding:8px}</style></head><body><img src="assets/img/logosovel133.png" style="width:110px"><h2>Relatório de Ferramentais</h2>${tabela}</body></html>`);
      newWin.document.close(); newWin.focus();
      mostrarStatus('🖨️ Janela de impressão aberta.', '#7ef2ff');
    }

    function escapeHtml(str){ if(!str) return ''; return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[s]); }

    // Expor funções para o escopo global para garantir disponibilidade
    window.__sgf = window.__sgf || {};
    window.__sgf.buscarFerramentais = buscarFerramentais;
    window.__sgf.gerarQRCode = gerarQRCode;
    window.__sgf.exportar = exportar;
    window.__sgf.retornarMenu = () => { window.location.href = 'menu.html'; };

    // observação: não executamos buscar automaticamente
  </script>

  <!-- Script "defensivo" que garante listeners mesmo que o módulo falhe -->
  <script>
    (function(){
      const $ = id => document.getElementById(id);
      const btnBuscar = $('btnBuscar'), btnGerarQR = $('btnGerarQR'), btnExport = $('btnExport'), btnMenu = $('btnMenu');
      const statusBar = document.getElementById('statusBar');

      function notify(msg, color='#00eaff'){
        statusBar.style.display='block'; statusBar.style.color=color; statusBar.textContent = msg;
        clearTimeout(statusBar._t); statusBar._t = setTimeout(()=> statusBar.style.display='none', 4500);
      }

      // safe call wrapper: chama função exposta ou mostra erro amigável
      function safeCall(name){
        return function(){
          try {
            const fn = window.__sgf && window.__sgf[name];
            if (typeof fn === 'function') {
              fn();
            } else {
              notify('⚠️ A funcionalidade não está disponível. Verifique o console.', '#ffd67a');
              console.warn(`Função ${name} não disponível em window.__sgf`);
            }
          } catch(err){
            notify('❌ Erro ao executar a ação. Veja console.', '#ff8a80');
            console.error(err);
          }
        };
      }

      if (btnBuscar) btnBuscar.addEventListener('click', safeCall('buscarFerramentais'));
      if (btnGerarQR) btnGerarQR.addEventListener('click', safeCall('gerarQRCode'));
      if (btnExport) btnExport.addEventListener('click', safeCall('exportar'));
      if (btnMenu) btnMenu.addEventListener('click', safeCall('retornarMenu'));

      // pequeno diagnóstico automático: se módulo não montou window.__sgf em 1.5s, mostra nota
      setTimeout(()=>{
        if (!window.__sgf || typeof window.__sgf.buscarFerramentais !== 'function') {
          notify('⚠️ Módulo principal não carregou ainda — funcionalidades dependem do backend.', '#ffd67a');
          console.warn('window.__sgf não exposto — verifique ./js/firebase-config.js ou erros de import no console.');
        }
      }, 1500);
    })();
  </script>
</body>
</html>
