<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Ferramental</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #00f0ff;
  }

  .consult-box {
    background: rgba(0,0,0,0.85);
    padding: 3rem;
    border-radius: 12px;
    box-shadow: 0 0 20px #00f0ff, 0 0 40px #ff00ff inset;
    width: 350px;
    text-align: center;
  }

  h1 {
    margin-bottom: 2rem;
    text-shadow: 0 0 10px #00f0ff, 0 0 20px #ff00ff;
  }

  input, button {
    width: 100%;
    padding: 0.8rem;
    margin: 0.8rem 0;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
    font-weight: bold;
  }

  input {
    background: rgba(0,0,0,0.3);
    color: #00f0ff;
    border: 1px solid #00f0ff;
  }

  button {
    background: linear-gradient(90deg, #00f0ff, #ff00ff);
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    box-shadow: 0 0 20px #ff00ff, 0 0 40px #00f0ff;
  }

  ul {
    list-style: none;
    padding: 0;
    margin-top: 1rem;
    text-align: left;
  }

  li {
    padding: 0.5rem 0;
    border-bottom: 1px solid #00f0ff;
  }
</style>
</head>
<body>

<div class="consult-box">
  <h1>Consultar Ferramental</h1>
  <input type="text" id="filtro" placeholder="Pesquisar...">
  <button id="btnPesquisar">Pesquisar</button>
  <button id="btnVoltar">Voltar</button>
  <ul id="lista"></ul>
</div>

<script>
  const ferramental = [
    { nome: "Martelo", codigo: "001" },
    { nome: "Chave de Fenda", codigo: "002" },
    { nome: "Alicate", codigo: "003" }
  ];

  document.getElementById("btnVoltar").addEventListener("click", () => {
    window.location.href = "menu.html";
  });

  document.getElementById("btnPesquisar").addEventListener("click", () => {
    const filtro = document.getElementById("filtro").value.toLowerCase();
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    ferramental
      .filter(f => f.nome.toLowerCase().includes(filtro) || f.codigo.includes(filtro))
      .forEach(f => {
        const li = document.createElement("li");
        li.textContent = `${f.nome} (Código: ${f.codigo})`;
        lista.appendChild(li);
      });
  });
</script>

</body>
</html>
