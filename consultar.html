<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar - SGF</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .logo-container {
      margin: 40px auto;
      filter: drop-shadow(0 0 8px #00eaff);
      display: inline-block;
    }

    img.logo {
      width: 200px;
    }

    input[type="text"] {
      padding: 8px;
      width: 300px;
      border-radius: 8px;
      border: none;
      margin-right: 10px;
    }

    .neon-button {
      padding: 12px;
      font-weight: bold;
      color: #00eaff;
      background-color: #0d1b2a;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
      transition: 0.3s ease-in-out;
      margin: 5px;
    }

    .neon-button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 80%;
    }

    th, td {
      border: 1px solid #00eaff44;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
  </div>

  <h2 style="color:#00eaff;">Consultar Ferramental</h2>

  <input type="text" id="buscarSV" placeholder="Digite o SV">
  <button class="neon-button" onclick="buscar()">Buscar</button>
  <a href="menu.html" class="neon-button">Menu Principal</a>

  <table id="resultado" style="display:none;">
    <thead>
      <tr>
        <th>SV</th>
        <th>Cliente</th>
        <th>Data Registro</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- Resultados aparecerão aqui -->
    </tbody>
  </table>

  <script>
    function buscar() {
      const sv = document.getElementById("buscarSV").value;
      if(!sv) return alert("Digite o SV!");

      // Exemplo: resultado simulado
      const tabela = document.getElementById("resultado");
      tabela.style.display = "table";
      tabela.querySelector("tbody").innerHTML = `
        <tr>
          <td>${sv}</td>
          <td>Cliente Exemplo</td>
          <td>2025-11-03</td>
          <td>
            <button class="neon-button">Editar</button>
            <button class="neon-button">Excluir</button>
            <button class="neon-button">Gerar QR</button>
          </td>
        </tr>
      `;
    }
  </script>

</body>
</html>
