<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Ferramentais - SGF</title>
<style>
  body {
    background-color: #0a0f1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    text-align: center;
  }
  h1 {
    color: #00eaff;
    text-shadow: 0 0 5px #00eaff;
  }
  input, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin: 5px;
  }
  input { width: 300px; }
  button {
    cursor: pointer;
    font-weight: bold;
    color: #00eaff;
    background-color: #0d1b2a;
    box-shadow: 0 0 5px #00eaff;
  }
  button:hover {
    color: #00ffff;
    box-shadow: 0 0 10px #00eaff;
  }
  table {
    width: 100%;
    max-width: 1200px;
    border-collapse: collapse;
    margin: 20px auto;
    background-color: #0d1b2a;
    border-radius: 10px;
    box-shadow: 0 0 20px #00eaff22;
  }
  th, td {
    border: 1px solid #00eaff44;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
  }
  th { background-color: #091224; color: #00eaff; }

  .btn-group {
    display: flex;
    justify-content: center;
    gap: 5px;
    flex-wrap: nowrap;
    margin-bottom: 10px;
  }

  .qr-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
  }

  .qr-container canvas {
    border: 10px solid #ffffff;
    border-radius: 10px;
    box-shadow: 0 0 10px #00eaff44;
  }
</style>
</head>
<body>
<h1>Consulta de Ferramentais</h1>
<input type="text" id="busca" placeholder="Digite SV, Nome ou NF-e">
<button id="btnBuscar">Buscar</button>

<table>
<thead>
<tr>
  <th>Tipo</th><th>NF-e</th><th>SV</th><th>Nome</th><th>Data Registro</th><th>Estado</th>
  <th>Localização</th><th>Responsável</th><th>Ações</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getDatabase, ref, get, remove, set } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.appspot.com",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ferramentaisRef = ref(db, "ferramentais");
const tabela = document.getElementById("tabela");

function gerarQRCodeComLogo(link, container, callback){
  container.innerHTML = ""; // Limpa QR anterior

  const tamanho = 250;
  const canvas = document.createElement("canvas");
  canvas.width = tamanho;
  canvas.height = tamanho;
  container.appendChild(canvas);

  // Gera QR Code temporário
  const qr = new QRCode(document.createElement("div"), {
    text: link,
    width: tamanho,
    height: tamanho,
    colorDark:"#000000",
    colorLight:"#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  // Pega a imagem do QR e desenha no canvas com logo
  setTimeout(() => { // espera QR ser gerado
    const qrCanvas = qr._el.querySelector("canvas");
    const ctx = canvas.getContext("2d");

    // Desenha QR no canvas final
    ctx.drawImage(qrCanvas, 0, 0, tamanho, tamanho);

    // Desenha borda branca
    ctx.lineWidth = 20;
    ctx.strokeStyle = "#ffffff";
    ctx.strokeRect(0, 0, tamanho, tamanho);

    // Desenha logo centralizado
    const logo = new Image();
    logo.src = "logosovel1337.png";
    logo.onload = () => {
      const logoTamanho = tamanho * 0.2;
      const x = (tamanho - logoTamanho)/2;
      const y = (tamanho - logoTamanho)/2;
      ctx.drawImage(logo, x, y, logoTamanho, logoTamanho);
      if(callback) callback(canvas);
    };
  }, 100);
}

function exibirFerramentais(dados) {
  tabela.innerHTML = "";
  dados.forEach(item => {
    const tr = document.createElement("tr");

    let responsavelNome = item.responsavel ? item.responsavel.split(".")[0] : item.responsavel;
    responsavelNome = responsavelNome ? responsavelNome.charAt(0).toUpperCase() + responsavelNome.slice(1) : "";

    tr.innerHTML = `
      <td>${item.tipo||""}</td>
      <td>${item.nfe||""}</td>
      <td>${item.sv||""}</td>
      <td>${item.nome||""}</td>
      <td>${item.dataRegistro||""}</td>
      <td>${item.estado||""}</td>
      <td>${item.localizacao||""}</td>
      <td>${responsavelNome||""}</td>
      <td>
        <div class="btn-group">
          <button class="editar">Editar</button>
          <button class="excluir">Excluir</button>
          <button class="qrcode">Gerar QR</button>
          <button class="exportar">Exportar QR</button>
        </div>
        <div class="qr-container"></div>
      </td>
    `;

    let qrCanvas = null;

    tr.querySelector(".editar").onclick = async () => {
      const novosDados = {
        tipo: prompt("Tipo:", item.tipo) || item.tipo,
        nfe: prompt("NF-e:", item.nfe) || item.nfe,
        sv: prompt("SV:", item.sv) || item.sv,
        nome: prompt("Nome:", item.nome) || item.nome,
        dataRegistro: prompt("Data Registro:", item.dataRegistro) || item.dataRegistro,
        estado: prompt("Estado:", item.estado) || item.estado,
        localizacao: prompt("Localização:", item.localizacao) || item.localizacao,
        responsavel: prompt("Responsável (email):", item.responsavel) || item.responsavel
      };
      try {
        await set(ref(db, `ferramentais/${item.id}`), novosDados);
        alert("Registro alterado com sucesso!");
        const snapshot = await get(ferramentaisRef);
        const lista = snapshot.exists() ? Object.keys(snapshot.val()).map(key=>({id:key, ...snapshot.val()[key]})) : [];
        exibirFerramentais(lista);
      } catch(err) { console.error(err); alert("Erro ao atualizar"); }
    };

    tr.querySelector(".excluir").onclick = async () => {
      if(confirm("Deseja realmente excluir este registro?")){
        try { await remove(ref(db, `ferramentais/${item.id}`)); tr.remove(); }
        catch(err){ console.error(err); alert("Erro ao excluir"); }
      }
    };

    tr.querySelector(".qrcode").onclick = () => {
      const qrContainer = tr.querySelector(".qr-container");
      gerarQRCodeComLogo(`detalhes.html?id=${item.id}`, qrContainer, (canvas) => {
        qrCanvas = canvas;
      });
    };

    tr.querySelector(".exportar").onclick = () => {
      if(qrCanvas){
        const a = document.createElement("a");
        a.href = qrCanvas.toDataURL("image/png");
        a.download = `${item.nome || 'qr-code'}.png`;
        a.click();
      } else {
        alert("Gere o QR Code primeiro.");
      }
    };

    tabela.appendChild(tr);
  });
}

document.getElementById("btnBuscar").onclick = async () => {
  const termo = document.getElementById("busca").value.toLowerCase();
  try {
    const snapshot = await get(ferramentaisRef);
    const lista = snapshot.exists() ? Object.keys(snapshot.val()).map(key=>({id:key, ...snapshot.val()[key]})) : [];
    const filtrados = lista.filter(item => 
      (item.sv && item.sv.toLowerCase().includes(termo)) ||
      (item.nome && item.nome.toLowerCase().includes(termo)) ||
      (item.nfe && item.nfe.toLowerCase().includes(termo))
    );
    if(filtrados.length) exibirFerramentais(filtrados);
    else { alert("Nenhum ferramental encontrado"); tabela.innerHTML=""; }
  } catch(err){ console.error(err); alert("Erro ao buscar"); }
};
</script>
</body>
</html>
