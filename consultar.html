<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Ferramental</title>

<style>
body {
    background-color: #0a0f1a;
    margin: 0; padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
}
h1 { color: #00eaff; text-shadow: 0 0 20px #00eaff; margin-top: 40px; }
input { padding: 0.8rem; margin-bottom: 1rem; border-radius: 5px; border: 1px solid #00eaff; background: #0d1b2a; color: #00eaff; width: 300px; }
input::placeholder { color: #66d9ff; }
button { padding: 1rem; background-color: #0d1b2a; color: #00eaff; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 0 5px #00eaff,0 0 10px #00eaff; transition: 0.3s; }
button:hover { color: #00ffff; box-shadow: 0 0 10px #00eaff,0 0 20px #00eaff; }
.neon-button { margin-top: 20px; display: inline-block; text-align: center; }
#resultado { margin-top: 20px; width: 80%; max-width: 600px; text-align: left; background: #0d1b2a; padding: 15px; border-radius: 10px; box-shadow: 0 0 10px #00eaff44; }
</style>

</head>
<body>

<h1>🔍 Consultar Ferramental</h1>

<input type="text" id="busca" placeholder="Digite o código ou descrição">
<button id="btnBuscar">Buscar</button>

<div id="resultado">Nenhum resultado.</div>

<a href="menu.html" class="neon-button">Voltar ao Menu</a>

<script>
const btnBuscar = document.getElementById("btnBuscar");
btnBuscar.addEventListener("click", () => {
    const valor = document.getElementById("busca").value.trim();
    if(!valor) { alert("Digite um valor para buscar."); return; }
    // Exemplo: mock de resultado
    document.getElementById("resultado").innerHTML = `Resultado encontrado para: <b>${valor}</b>`;
});
</script>

</body>
</html>
