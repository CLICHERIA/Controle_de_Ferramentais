<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Ferramentais — Grupo Sovel</title>
  <link rel="icon" href="assets/img/logosovel132.png" type="image/png" />
  <style>
    body {
      background-color: #0a0f1a;
      color: #d8f6ff;
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: #00eaff;
      text-shadow: 0 0 15px #00eaffaa;
      margin-top: 30px;
      font-weight: 700;
    }

    .acoes-topo {
      text-align: center;
      margin-top: 25px;
      margin-bottom: 25px;
    }

    input {
      padding: 10px;
      width: 280px;
      border-radius: 8px;
      border: 1px solid #00eaff44;
      background-color: #0d1b2a;
      color: #e0faff;
      text-align: center;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: #88c4d9;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: bold;
      margin: 5px;
      background-color: #0d1b2a;
      color: #00eaff;
      box-shadow: 0 0 8px #00eaff55;
      transition: 0.2s;
    }

    button:hover {
      background-color: #00eaff22;
      box-shadow: 0 0 15px #00eaff99;
      color: #b9f8ff;
    }

    .container {
      width: 92%;
      margin: 30px auto;
      background: rgba(0, 10, 20, 0.65);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 25px #00eaff22;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #00eaff22;
    }

    th {
      color: #00eaff;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      background-color: #09111f;
    }

    td {
      color: #d9f9ff;
      font-size: 14.5px;
    }

    .linha-sv {
      background: rgba(0, 234, 255, 0.05);
      color: #00eaff;
      font-weight: 600;
      transition: background 0.3s;
    }

    .linha-sv:hover {
      background: rgba(0, 234, 255, 0.1);
    }

    .subtabela {
      background: #0a0f1a;
      border: 1px solid #00eaff33;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 20px #00eaff22 inset;
    }

    .tabela-interna {
      width: 100%;
      border-collapse: collapse;
      color: #e0faff;
      font-size: 14px;
    }

    .tabela-interna th {
      text-align: left;
      padding: 6px;
      border-bottom: 1px solid #00eaff44;
      color: #00eaff;
    }

    .tabela-interna td {
      padding: 6px;
      border-bottom: 1px solid #00eaff22;
    }

    .botao-acao {
      background: transparent;
      border: 1px solid #00eaff55;
      color: #00eaff;
      padding: 4px 9px;
      margin: 2px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }

    .botao-acao:hover {
      background: #00eaff22;
      box-shadow: 0 0 8px #00eaff88;
    }

    .botao-expandir {
      background: transparent;
      border: 1px solid #00eaff88;
      color: #00eaff;
      padding: 5px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      box-shadow: 0 0 8px #00eaff44;
    }

    .botao-expandir:hover {
      background: #00eaff22;
      box-shadow: 0 0 15px #00eaff77;
    }

    footer {
      text-align: center;
      color: #00eaff88;
      padding: 20px;
      font-size: 14px;
      border-top: 1px solid #00eaff33;
      margin-top: 40px;
    }
  </style>
</head>

<body>
  <h1>Consulta de Ferramentais</h1>

  <div class="acoes-topo">
    <input type="text" id="busca" placeholder="Digite o número da SV ou nome">
    <button id="btnBuscar">Consultar</button>
    <button id="btnVoltar">Retornar ao Menu</button>
  </div>

  <div class="container">
    <table id="tabela">
      <thead>
        <tr>
          <th>SV</th>
          <th>NF-e</th>
          <th>Nome</th>
          <th>Data Registro</th>
          <th>Estado</th>
          <th>Localização</th>
          <th>Responsável do Cadastro</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer>© 2025 Grupo Sovel — Departamento de Amostras e Clicheria</footer>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
      authDomain: "dacsovel-53481.firebaseapp.com",
      databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
      projectId: "dacsovel-53481",
      storageBucket: "dacsovel-53481.appspot.com",
      messagingSenderId: "37867522513",
      appId: "1:37867522513:web:336d687e3fc8408bd138f0",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tabela = document.querySelector("#tabela tbody");
    const btnBuscar = document.getElementById("btnBuscar");
    const btnVoltar = document.getElementById("btnVoltar");

    btnVoltar.onclick = () => (window.location.href = "menu.html");

    btnBuscar.onclick = async () => {
      const termo = document.getElementById("busca").value.trim().toLowerCase();
      const snapshot = await get(ref(db, "ferramentais"));
      if (!snapshot.exists()) {
        tabela.innerHTML = "<tr><td colspan='8'>Nenhum registro encontrado</td></tr>";
        return;
      }

      const lista = Object.keys(snapshot.val()).map(id => ({ id, ...snapshot.val()[id] }));
      const filtrados = lista.filter(item =>
        (item.sv && item.sv.toLowerCase().includes(termo)) ||
        (item.nome && item.nome.toLowerCase().includes(termo))
      );

      if (filtrados.length) exibirFerramentais(filtrados);
      else tabela.innerHTML = "<tr><td colspan='8'>Nenhum resultado encontrado</td></tr>";
    };

    function exibirFerramentais(dados) {
      tabela.innerHTML = "";
      const gruposSV = {};

      dados.forEach(item => {
        const sv = item.sv || "Sem SV";
        if (!gruposSV[sv]) gruposSV[sv] = [];
        gruposSV[sv].push(item);
      });

      Object.keys(gruposSV).forEach(sv => {
        const itens = gruposSV[sv];
        const primeiro = itens[0];

        const trGrupo = document.createElement("tr");
        trGrupo.classList.add("linha-sv");
        trGrupo.innerHTML = `
          <td>${sv}</td>
          <td>${primeiro.nfe || ""}</td>
          <td>${primeiro.nome || ""}</td>
          <td>${primeiro.dataRegistro || ""}</td>
          <td>${primeiro.estado || ""}</td>
          <td>${primeiro.localizacao || ""}</td>
          <td>${formatarResponsavel(primeiro.responsavel)}</td>
          <td><button class="botao-expandir">➕ Ver itens (${itens.length})</button></td>
        `;
        tabela.appendChild(trGrupo);

        const trDetalhes = document.createElement("tr");
        const tdDetalhes = document.createElement("td");
        tdDetalhes.colSpan = 8;
        tdDetalhes.innerHTML = `
          <div class="subtabela">
            <table class="tabela-interna">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Data Registro</th>
                  <th>Estado</th>
                  <th>Localização</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                ${itens.map(item => `
                  <tr>
                    <td>${item.nome || ""}</td>
                    <td>${item.dataRegistro || ""}</td>
                    <td>${item.estado || ""}</td>
                    <td>${item.localizacao || ""}</td>
                    <td>
                      <button class="botao-acao editar" data-id="${item.id}">Editar</button>
                      <button class="botao-acao excluir" data-id="${item.id}">Excluir</button>
                      <button class="botao-acao qrcode" data-id="${item.id}">Gerar QR-Code</button>
                      <button class="botao-acao exportar" data-id="${item.id}">Exportar QR-Code</button>
                      <canvas class="qr-canvas" style="display:none; margin-top:5px;"></canvas>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;
        trDetalhes.style.display = "none";
        trDetalhes.appendChild(tdDetalhes);
        tabela.appendChild(trDetalhes);

        const botaoExpandir = trGrupo.querySelector(".botao-expandir");
        botaoExpandir.onclick = () => {
          const visivel = trDetalhes.style.display === "table-row";
          trDetalhes.style.display = visivel ? "none" : "table-row";
          botaoExpandir.innerHTML = visivel
            ? "➕ Ver itens (" + itens.length + ")"
            : "➖ Recolher itens";
        };

        tdDetalhes.querySelectorAll(".editar").forEach(btn => {
          btn.onclick = () => (window.location.href = `editar.html?id=${btn.dataset.id}`);
        });

        tdDetalhes.querySelectorAll(".excluir").forEach(btn => {
          btn.onclick = async () => {
            if (confirm("Deseja realmente excluir este registro?")) {
              await remove(ref(db, `ferramentais/${btn.dataset.id}`));
              btn.closest("tr").remove();
            }
          };
        });

        tdDetalhes.querySelectorAll(".qrcode").forEach(btn => {
          btn.onclick = () => gerarQRCode(btn);
        });

        tdDetalhes.querySelectorAll(".exportar").forEach(btn => {
          btn.onclick = () => exportarQRCode(btn);
        });
      });
    }

    function formatarResponsavel(email) {
      if (!email) return "";
      const nome = email.split("@")[0].split(".")[0];
      return nome.charAt(0).toUpperCase() + nome.slice(1);
    }

    function gerarQRCode(botao) {
      const id = botao.dataset.id;
      const canvas = botao.parentNode.querySelector(".qr-canvas");
      const linkDetalhes = `${window.location.origin}/SGF/detalhes.html?id=${id}`;
      canvas.style.display = "block";
      const qr = new QRCode(canvas, {
        text: linkDetalhes,
        width: 150,
        height: 150,
        colorDark: "#000",
        colorLight: "#fff",
        correctLevel: QRCode.CorrectLevel.H,
      });
    }

    function exportarQRCode(botao) {
      const canvas = botao.parentNode.querySelector(".qr-canvas");
      if (!canvas.toDataURL) return alert("Gere o QR-Code primeiro!");
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "QRCode_SGF.png";
      link.click();
    }
  </script>
</body>
</html>
