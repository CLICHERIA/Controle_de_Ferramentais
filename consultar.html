<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Ferramental</title>
  <style>
    body {
      background-color: #0a0f1a;
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a {
      color: #00eaff;
      text-decoration: none;
    }

    .logo-container {
      margin-top: 40px;
      text-align: center;
    }

    img.logo {
      width: 200px;
      filter: drop-shadow(0 0 8px #00eaff);
    }

    h1 {
      color: #00eaff;
      text-shadow: 0 0 20px #00eaff;
      text-align: center;
      margin: 20px 0;
    }

    .consulta-box {
      background-color: #0d1b2a;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00eaff33;
      max-width: 500px;
      width: 90%;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #00eaff;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00eaff44;
      background-color: #0a0f1a;
      color: #ffffff;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #0d1b2a;
      color: #00eaff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow:
        0 0 5px #00eaff,
        0 0 10px #00eaff,
        0 0 20px #00eaff;
      transition: 0.3s ease-in-out;
    }

    button:hover {
      color: #00ffff;
      box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 30px #00eaff;
    }

    .resultado {
      margin-top: 20px;
      background-color: #0a0f1a;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px #00eaff33;
    }
  </style>
</head>
<body>

<div class="logo-container">
  <img src="logosovel1337.png" alt="Logo Grupo Sovel da Amazônia" class="logo">
</div>

<h1>Consultar Ferramental</h1>

<div class="consulta-box">
  <label for="consultaSV">Informe o SV do Ferramental</label>
  <input type="text" id="consultaSV" placeholder="Ex: F123">
  <button id="btnConsultar">Consultar</button>
</div>

<div class="resultado" id="resultado" style="display:none;">
  <p>⚡ Resultado da Consulta ⚡</p>
  <p id="infoFerramental"></p>
</div>

<script>
  const btn = document.getElementById('btnConsultar');
  btn.addEventListener('click', () => {
    const sv = document.getElementById('consultaSV').value;
    if(sv === "") { alert("Informe um SV válido!"); return; }
    // Aqui você poderia integrar com banco de dados
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('infoFerramental').innerText = `Ferramental com SV: ${sv} - Tipo: Faca / Cliente: Exemplo / Registrado em: 01/01/2025`;
  });
</script>

</body>
</html>
