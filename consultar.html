<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Ferramenta</title>

<style>
body {
    background-color: #0a0f1a;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    margin:0; padding:0;
}

h1 { text-align:center; color:#00eaff; text-shadow:0 0 20px #00eaff; margin-top:20px; }

.container {
    display:flex; flex-direction:column; align-items:center;
    margin:30px auto;
    width:90%;
    max-width:600px;
}

input {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #00eaff;
    background-color:#0a0f1a;
    color:#00eaff;
}

input::placeholder { color:#66d9ff; }

button {
    padding:12px 20px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background-color:#0d1b2a;
    color:#00eaff;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff;
    transition:0.3s ease-in-out;
}

button:hover {
    color:#00ffff;
    box-shadow:0 0 10px #00eaff,0 0 20px #00eaff,0 0 30px #00eaff;
}

.resultado {
    margin-top:20px;
    background:#0d1b2a;
    padding:20px;
    border-radius:10px;
    width:100%;
    box-shadow:0 0 10px #00eaff33;
}
</style>
</head>
<body>

<h1>Consultar Ferramenta</h1>

<div class="container">
    <input type="text" id="codigo" placeholder="Digite o Código da Ferramenta">
    <button id="btnBuscar">Buscar</button>
    <div id="resultado" class="resultado"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const btnBuscar = document.getElementById("btnBuscar");
const resultado = document.getElementById("resultado");

btnBuscar.addEventListener("click", async () => {
    const codigo = document.getElementById("codigo").value;
    resultado.innerHTML = "Buscando...";
    try {
        const q = query(collection(db, "ferramentas"), where("codigo", "==", codigo));
        const querySnapshot = await getDocs(q);
        if(querySnapshot.empty){
            resultado.innerHTML = "<strong>Nenhuma ferramenta encontrada.</strong>";
        } else {
            resultado.innerHTML = "";
            querySnapshot.forEach(doc => {
                const data = doc.data();
                resultado.innerHTML += `<p><strong>Nome:</strong> ${data.nome}<br><strong>Código:</strong> ${data.codigo}<br><strong>Descrição:</strong> ${data.descricao}</p><hr>`;
            });
        }
    } catch(err){
        resultado.innerHTML = "Erro ao consultar: " + err.message;
    }
});
</script>

</body>
</html>
