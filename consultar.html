<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Ferramentais - SGF</title>
<style>
  body {
    background-color: #0a0f1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    text-align:center;
  }
  h1 {
    color: #00eaff;
    text-shadow: 0 0 5px #00eaff;
  }
  input, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin: 5px;
  }
  input { width: 300px; }
  button {
    cursor: pointer;
    font-weight: bold;
    color: #00eaff;
    background-color: #0d1b2a;
    box-shadow: 0 0 5px #00eaff;
  }
  button:hover {
    color: #00ffff;
    box-shadow: 0 0 10px #00eaff;
  }
  table {
    width: 100%;
    max-width: 1200px;
    border-collapse: collapse;
    margin: 20px auto;
    background-color: #0d1b2a;
    border-radius: 10px;
    box-shadow: 0 0 20px #00eaff22;
  }
  th, td {
    border: 1px solid #00eaff44;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
  }
  th { background-color: #091224; color: #00eaff; }

  .btn-group {
    display: inline-flex;
    gap: 5px;
  }

  .qr-container {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }

  .qr-canvas {
    border-radius: 10px;
    box-shadow: 0 0 10px #00eaff44;
    display: none;
  }
</style>
</head>
<body>
<h1>Consulta de Ferramentais</h1>
<input type="text" id="busca" placeholder="Digite SV, Nome ou NF-e">
<button id="btnBuscar">Buscar</button>

<table>
<thead>
<tr>
  <th>Tipo</th><th>NF-e</th><th>SV</th><th>Nome</th><th>Data Registro</th><th>Estado</th>
  <th>Localização</th><th>Responsável</th><th>Ações</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<!-- ✅ carrega a lib do QRCode corretamente -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<!-- 🔧 Firebase module -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
  import { getDatabase, ref, get, remove, set } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
    authDomain: "dacsovel-53481.firebaseapp.com",
    databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
    projectId: "dacsovel-53481",
    storageBucket: "dacsovel-53481.appspot.com",
    messagingSenderId: "37867522513",
    appId: "1:37867522513:web:336d687e3fc8408bd138f0",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.db = db;
  window.ref = ref;
  window.get = get;
  window.remove = remove;
  window.set = set;
</script>

<!-- ✅ Script principal -->
<script>
window.addEventListener("load", async () => {
  const ferramentaisRef = ref(db, "ferramentais");
  const tabela = document.getElementById("tabela");

  document.getElementById("btnBuscar").onclick = async () => {
    const termo = document.getElementById("busca").value.toLowerCase();
    const snapshot = await get(ferramentaisRef);
    const lista = snapshot.exists()
      ? Object.keys(snapshot.val()).map(key => ({ id: key, ...snapshot.val()[key] }))
      : [];
    const filtrados = lista.filter(item =>
      (item.sv && item.sv.toLowerCase().includes(termo)) ||
      (item.nome && item.nome.toLowerCase().includes(termo)) ||
      (item.nfe && item.nfe.toLowerCase().includes(termo))
    );
    exibirFerramentais(filtrados);
  };

  function exibirFerramentais(dados) {
    tabela.innerHTML = "";
    dados.forEach(item => {
      const tr = document.createElement("tr");
      let responsavelNome = item.responsavel ? item.responsavel.split(".")[0] : item.responsavel;
      responsavelNome = responsavelNome ? responsavelNome.charAt(0).toUpperCase() + responsavelNome.slice(1) : "";

      tr.innerHTML = `
        <td>${item.tipo || ""}</td>
        <td>${item.nfe || ""}</td>
        <td>${item.sv || ""}</td>
        <td>${item.nome || ""}</td>
        <td>${item.dataRegistro || ""}</td>
        <td>${item.estado || ""}</td>
        <td>${item.localizacao || ""}</td>
        <td>${responsavelNome || ""}</td>
        <td>
          <div class="btn-group">
            <button class="editar">Editar</button>
            <button class="excluir">Excluir</button>
            <button class="qrcode">Gerar QR</button>
            <button class="exportar">Exportar QR</button>
          </div>
          <div class="qr-container">
            <canvas class="qr-canvas"></canvas>
          </div>
        </td>
      `;

      const canvas = tr.querySelector(".qr-canvas");
      let qrDataURL = null;

      // ✅ Gerar QR code
      tr.querySelector(".qrcode").onclick = () => {
        const linkDetalhes = `${window.location.origin}/SGF/detalhes.html?id=${item.id}`;
        canvas.style.display = "block";

        const size = 300;
        const quietZone = 20;
        const qrTemp = document.createElement("div");

        // gera QR no container temporário
        new QRCode(qrTemp, {
          text: linkDetalhes,
          width: size,
          height: size,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

        setTimeout(() => {
          const qrImg = qrTemp.querySelector("img") || qrTemp.querySelector("canvas");
          if (!qrImg) {
            alert("Erro ao gerar QR Code.");
            return;
          }

          const ctx = canvas.getContext("2d");
          const img = new Image();
          img.src = qrImg.src || qrImg.toDataURL("image/png");

          img.onload = () => {
            canvas.width = size + quietZone * 2;
            canvas.height = size + quietZone * 2;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, quietZone, quietZone, size, size);

            const logo = new Image();
            logo.src = "logosovel1337.png";
            logo.onload = () => {
              const logoSize = 50;
              ctx.drawImage(logo, (canvas.width - logoSize) / 2, (canvas.height - logoSize) / 2, logoSize, logoSize);
            };

            qrDataURL = canvas.toDataURL("image/png");
          };
        }, 200); // pequena espera garante que QRCode foi renderizado
      };

      // ✅ Exportar QR code
      tr.querySelector(".exportar").onclick = () => {
        if (!qrDataURL) return alert("Gere o QR Code primeiro.");
        const a = document.createElement("a");
        a.href = qrDataURL;
        a.download = `${item.nome || "qr-code"}.png`;
        a.click();
      };

      tr.querySelector(".excluir").onclick = async () => {
        if (confirm("Deseja realmente excluir este registro?")) {
          await remove(ref(db, "ferramentais/" + item.id));
          tr.remove();
        }
      };

      tr.querySelector(".editar").onclick = () => {
        window.location.href = `editar.html?id=${item.id}`;
      };

      tabela.appendChild(tr);
    });
  }
});
</script>
</body>
</html>
