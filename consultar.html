<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Consultar Ferramental - SGF</title>

<style>
  body {
    background-color: #0a0f1a;
    margin: 0;
    padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
  }

  html, body { width:100%; height:100%; }

  a { color: #00eaff; text-decoration: none; }

  .logo-container {
    display: block;
    text-align: center;
    margin: 40px 0 20px 0;
  }

  img.logo { width: 200px; filter: drop-shadow(0 0 8px #00eaff); }

  .neon-button {
    display: inline-block;
    padding: 8px 20px;
    color: #00eaff;
    font-weight: bold;
    font-size: 14px;
    border-radius: 10px;
    background-color: #0d1b2a;
    box-shadow:0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff,0 0 40px #00eaff55;
    transition: 0.3s ease-in-out;
    margin: 3px;
    animation: neonPulse 1.5s infinite alternate;
    cursor:pointer;
  }

  .neon-button:hover {
    color: #00ffff;
    box-shadow:0 0 10px #00eaff,0 0 20px #00eaff,0 0 30px #00eaff,0 0 50px #00eaff77;
  }

  @keyframes neonPulse {
    0%,100{box-shadow:0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff;}
    50%{box-shadow:0 0 15px #00eaff,0 0 30px #00eaff,0 0 45px #00eaff77;}
  }

  #painelUsuario {
    position: fixed;
    top: 20px;
    right: 20px;
    background-color: #0d1b2a;
    padding: 10px 15px;
    border-radius: 10px;
    box-shadow: 0 0 20px #00eaff55;
    color: #00eaff;
    text-align: right;
    z-index: 1000;
  }

  .centralizado {
    text-align: center;
    max-width: 800px;
    margin: 0 auto;
  }

  table { width:100%; border-collapse: collapse; margin-top:20px; }
  th, td { padding:10px; text-align:left; border-bottom:1px solid #00eaff44; }
</style>
</head>
<body>

<div id="painelUsuario">
  <div><b>Nome:</b> <span id="nomeUsuario">---</span></div>
  <div><b>Função:</b> <span id="funcaoUsuario">---</span></div>
</div>

<div class="logo-container">
  <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
</div>

<div class="centralizado">
  <h2 style="color:#00bfff;">Consultar Ferramental</h2>

  <input type="text" id="busca" placeholder="Buscar por SV ou Cliente">
  <button id="btnBuscar" class="neon-button">Buscar</button>

  <table id="tabelaResultados">
    <thead>
      <tr>
        <th>SV</th>
        <th>Cliente</th>
        <th>Tipo</th>
        <th>Data Registro</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <!-- Resultados aparecem aqui -->
    </tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const equipeDAC = {
  "samueldson@example.com":"Supervisor",
  "rafaelly@example.com":"Analista Administrativo",
  "elienson@example.com":"Assistente",
  "gustavo@example.com":"Assistente",
  "vanessa@example.com":"Assistente"
};

onAuthStateChanged(auth, (user) => {
  if(user){
    const nome = user.displayName || user.email;
    const funcao = equipeDAC[user.email] || "Operador";
    document.getElementById('nomeUsuario').textContent = nome;
    document.getElementById('funcaoUsuario').textContent = funcao;
  } else {
    window.location.href = "index.html";
  }
});

// Exemplo de dados
const dadosExemplo = [
  {sv:"SV123", cliente:"Cliente A", tipo:"Faca", data:"2025-11-03"},
  {sv:"SV456", cliente:"Cliente B", tipo:"Clichê", data:"2025-11-02"}
];

function renderTabela(ferramentais){
  const tbody = document.querySelector("#tabelaResultados tbody");
  tbody.innerHTML = "";
  ferramentais.forEach(f=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${f.sv}</td>
      <td contenteditable="false">${f.cliente}</td>
      <td>${f.tipo}</td>
      <td contenteditable="false">${f.data}</td>
      <td>
        <button class="neon-button editar">Editar</button>
        <button class="neon-button excluir">Excluir</button>
        <button class="neon-button gerarQR">QR Code</button>
      </td>
    `;
    tbody.appendChild(tr);

    tr.querySelector(".editar").addEventListener("click", ()=>{
      const tdCliente = tr.cells[1];
      const tdData = tr.cells[3];
      tdCliente.contentEditable = true;
      tdData.contentEditable = true;
      tdCliente.focus();
      tdData.focus();
      alert("Edite os campos Cliente e Data e pressione Enter para salvar");
    });

    tr.querySelector(".excluir").addEventListener("click", ()=>{
      if(confirm("Deseja realmente excluir este ferramental?")){
        tr.remove();
      }
    });

    tr.querySelector(".gerarQR").addEventListener("click", ()=>{
      alert("Aqui será gerado o QR Code com logo Sovel em PNG"); // Substituir com geração real
    });
  });
}

document.getElementById("btnBuscar").addEventListener("click", ()=>{
  const termo = document.getElementById("busca").value.toLowerCase();
  const filtrado = dadosExemplo.filter(f=>f.sv.toLowerCase().includes(termo) || f.cliente.toLowerCase().includes(termo));
  renderTabela(filtrado);
});
</script>
</body>
</html>
