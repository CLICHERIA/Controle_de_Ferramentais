<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Ferramentais - SGF</title>
<style>
  body {
    background-color: #0a0f1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    text-align:center;
  }
  h1 {
    color: #00eaff;
    text-shadow: 0 0 5px #00eaff;
  }
  input, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin: 5px;
  }
  input { width: 300px; }
  button {
    cursor: pointer;
    font-weight: bold;
    color: #00eaff;
    background-color: #0d1b2a;
    box-shadow: 0 0 5px #00eaff;
  }
  button:hover {
    color: #00ffff;
    box-shadow: 0 0 10px #00eaff;
  }
  table {
    width: 100%;
    max-width: 1200px;
    border-collapse: collapse;
    margin: 20px auto;
    background-color: #0d1b2a;
    border-radius: 10px;
    box-shadow: 0 0 20px #00eaff22;
  }
  th, td {
    border: 1px solid #00eaff44;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
  }
  th { background-color: #091224; color: #00eaff; }

  .btn-group {
    display: inline-flex;
    gap: 5px;
  }

  .qr-container {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }

  .qr-canvas {
    border-radius: 10px;
    box-shadow: 0 0 10px #00eaff44;
    display: none;
  }

  .top-buttons {
    margin-bottom: 20px;
  }

  .nf-container {
    background-color: #091224;
    border: 1px solid #00eaff55;
    border-radius: 8px;
    margin: 10px auto;
    width: 95%;
    box-shadow: 0 0 10px #00eaff33;
  }

  .nf-header {
    background-color: #0d1b2a;
    color: #00eaff;
    padding: 12px;
    font-weight: bold;
    text-align: left;
    border-radius: 8px;
    cursor: pointer;
    text-shadow: 0 0 5px #00eaff;
    transition: 0.3s;
  }

  .nf-header:hover {
    color: #00ffff;
    text-shadow: 0 0 8px #00ffff;
  }

  .nf-items {
    display: none;
    padding: 10px;
  }

  .nf-items table {
    width: 100%;
    margin-top: 10px;
  }
</style>
</head>
<body>
<h1>Consulta de Ferramentais</h1>

<div class="top-buttons">
  <input type="text" id="busca" placeholder="Digite SV, Nome ou NF-e">
  <button id="btnBuscar">Buscar</button>
  <button id="btnVoltarMenu">Voltar ao Menu</button>
</div>

<div id="container"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
  import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
    authDomain: "dacsovel-53481.firebaseapp.com",
    databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
    projectId: "dacsovel-53481",
    storageBucket: "dacsovel-53481.appspot.com",
    messagingSenderId: "37867522513",
    appId: "1:37867522513:web:336d687e3fc8408bd138f0",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const ferramentaisRef = ref(db, "ferramentais");
  const container = document.getElementById("container");
  const btnBuscar = document.getElementById("btnBuscar");
  const btnVoltar = document.getElementById("btnVoltarMenu");

  btnVoltar.onclick = () => window.location.href = "menu.html";

  btnBuscar.onclick = async () => {
    const termo = document.getElementById("busca").value.toLowerCase();
    const snapshot = await get(ferramentaisRef);
    const lista = snapshot.exists()
      ? Object.keys(snapshot.val()).map(key => ({ id: key, ...snapshot.val()[key] }))
      : [];

    const filtrados = lista.filter(item =>
      (item.sv && item.sv.toLowerCase().includes(termo)) ||
      (item.nome && item.nome.toLowerCase().includes(termo)) ||
      (item.nfe && item.nfe.toLowerCase().includes(termo))
    );

    if (filtrados.length) exibirAgrupados(filtrados);
    else container.innerHTML = "<p>Nenhum ferramental encontrado.</p>";
  };

  function exibirAgrupados(dados) {
    container.innerHTML = "";
    const grupos = {};

    // Agrupar por NF-e
    dados.forEach(item => {
      const chave = item.nfe || "Sem NF-e";
      if (!grupos[chave]) grupos[chave] = [];
      grupos[chave].push(item);
    });

    // Criar blocos por NF-e
    Object.keys(grupos).forEach(nfe => {
      const div = document.createElement("div");
      div.className = "nf-container";

      const header = document.createElement("div");
      header.className = "nf-header";
      header.textContent = `NF-e: ${nfe} (${grupos[nfe].length} item${grupos[nfe].length > 1 ? "s" : ""})`;
      div.appendChild(header);

      const itensDiv = document.createElement("div");
      itensDiv.className = "nf-items";

      const tabela = document.createElement("table");
      tabela.innerHTML = `
        <thead>
          <tr>
            <th>Tipo</th><th>SV</th><th>Nome</th><th>Data Registro</th>
            <th>Estado</th><th>Localização</th><th>Responsável</th><th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;

      const corpo = tabela.querySelector("tbody");

      grupos[nfe].forEach(item => {
        const tr = document.createElement("tr");
        let responsavelNome = item.responsavel ? item.responsavel.split(".")[0] : "";
        responsavelNome = responsavelNome ? responsavelNome.charAt(0).toUpperCase() + responsavelNome.slice(1) : "";

        tr.innerHTML = `
          <td>${item.tipo || ""}</td>
          <td>${item.sv || ""}</td>
          <td>${item.nome || ""}</td>
          <td>${item.dataRegistro || ""}</td>
          <td>${item.estado || ""}</td>
          <td>${item.localizacao || ""}</td>
          <td>${responsavelNome || ""}</td>
          <td>
            <div class="btn-group">
              <button class="editar">Editar</button>
              <button class="excluir">Excluir</button>
              <button class="qrcode">QRCODE</button>
              <button class="exportar">Exportar QR</button>
            </div>
            <div class="qr-container">
              <canvas class="qr-canvas"></canvas>
            </div>
          </td>
        `;

        const canvas = tr.querySelector(".qr-canvas");
        let qrDataURL = null;
        const linkDetalhes = `${window.location.origin}/SGF/detalhes.html?id=${item.id}`;

        const gerarQRCode = () => {
          canvas.style.display = "block";
          const size = 300, quietZone = 20;

          const temp = document.createElement("div");
          new QRCode(temp, {
            text: linkDetalhes,
            width: size,
            height: size,
            colorDark: "#000",
            colorLight: "#fff",
            correctLevel: QRCode.CorrectLevel.H
          });

          setTimeout(() => {
            const qrImg = temp.querySelector("img") || temp.querySelector("canvas");
            if (!qrImg) return alert("Erro ao gerar QR Code.");

            const ctx = canvas.getContext("2d");
            const img = new Image();
            img.src = qrImg.src || qrImg.toDataURL("image/png");

            img.onload = () => {
              canvas.width = size + quietZone * 2;
              canvas.height = size + quietZone * 2;
              ctx.fillStyle = "#ffffff";
              ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.drawImage(img, quietZone, quietZone, size, size);

              const logo = new Image();
              logo.src = "logosovel1337.png";
              logo.onload = () => {
                const logoSize = 50;
                ctx.drawImage(logo, (canvas.width - logoSize) / 2, (canvas.height - logoSize) / 2, logoSize, logoSize);
                qrDataURL = canvas.toDataURL("image/png");
              };
            };
          }, 200);
        };

        tr.querySelector(".qrcode").onclick = gerarQRCode;

        tr.querySelector(".exportar").onclick = () => {
          if (!qrDataURL) return alert("Gere o QR Code primeiro.");
          const a = document.createElement("a");
          a.href = qrDataURL;
          a.download = `${item.nome || "qr-code"}.png`;
          a.click();
        };

        tr.querySelector(".editar").onclick = () => window.location.href = `editar.html?id=${item.id}`;
        tr.querySelector(".excluir").onclick = async () => {
          if (confirm("Deseja realmente excluir este registro?")) {
            await remove(ref(db, `ferramentais/${item.id}`));
            tr.remove();
          }
        };

        corpo.appendChild(tr);
      });

      itensDiv.appendChild(tabela);
      div.appendChild(itensDiv);

      // Clique no cabeçalho da NF-e expande/recolhe os itens
      header.onclick = () => {
        itensDiv.style.display = itensDiv.style.display === "none" || itensDiv.style.display === "" ? "block" : "none";
      };

      container.appendChild(div);
    });
  }
</script>
</body>
</html>
