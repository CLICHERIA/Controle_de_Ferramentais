<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Ferramentais - SGF</title>
  <style>
    body { background-color: #0a0f1a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; text-align:center;}
    h1 { color: #00eaff; text-shadow: 0 0 5px #00eaff; text-align: center; }
    input, button { padding: 10px; border-radius: 8px; border: none; font-size: 16px; margin: 5px; }
    input { width: 300px; }
    button { cursor: pointer; font-weight: bold; color: #00eaff; background-color: #0d1b2a; box-shadow: 0 0 5px #00eaff; }
    button:hover { color: #00ffff; box-shadow: 0 0 10px #00eaff; }
    table { width: 100%; max-width: 1200px; border-collapse: collapse; margin: 20px auto; background-color: #0d1b2a; border-radius: 10px; box-shadow: 0 0 20px #00eaff22; }
    th, td { border: 1px solid #00eaff44; padding: 8px; text-align: center; vertical-align: middle; }
    th { background-color: #091224; color: #00eaff; }
    .qr-cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .btn-group { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
    .qr-placeholder img { margin-top: 10px; border-radius: 10px; box-shadow: 0 0 10px #00eaff44; }
    video { width: 300px; border-radius: 10px; margin-top: 10px; }
  </style>
</head>
<body>
<h1>Consulta de Ferramentais</h1>
<input type="text" id="busca" placeholder="Digite SV, Nome ou NF-e">
<button id="btnBuscar">Buscar</button>
<table>
  <thead>
    <tr>
      <th>Tipo</th><th>NF-e</th><th>SV</th><th>Nome</th><th>Data Registro</th><th>Estado</th>
      <th>Localização</th><th>Responsável</th><th>Ações</th>
    </tr>
  </thead>
  <tbody id="tabela"></tbody>
</table>

<!-- Bibliotecas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
import { getDatabase, ref, get, remove, set } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.appspot.com",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const ferramentaisRef = ref(db, "ferramentais");
const tabela = document.getElementById("tabela");

function exibirFerramentais(dados) {
  tabela.innerHTML = "";
  dados.forEach(item => {
    const tr = document.createElement("tr");
    // Extrair primeiro nome do responsável
    let responsavelNome = item.responsavel ? item.responsavel.split(".")[0] : item.responsavel;
    responsavelNome = responsavelNome ? responsavelNome.charAt(0).toUpperCase() + responsavelNome.slice(1) : "";

    tr.innerHTML = `
      <td>${item.tipo||""}</td>
      <td>${item.nfe||""}</td>
      <td>${item.sv||""}</td>
      <td>${item.nome||""}</td>
      <td>${item.dataRegistro||""}</td>
      <td>${item.estado||""}</td>
      <td>${item.localizacao||""}</td>
      <td>${responsavelNome||""}</td>
      <td class="qr-cell">
        <div class="btn-group">
          <button class="editar">Editar</button>
          <button class="excluir">Excluir</button>
          <button class="qrcode">Gerar QR</button>
          <button class="exportar">Exportar QR</button>
        </div>
        <div class="qr-placeholder"></div>
      </td>
    `;

    // Botão Editar
    tr.querySelector(".editar").onclick = async () => {
      const novosDados = {};
      novosDados.tipo = prompt("Tipo:", item.tipo) || item.tipo;
      novosDados.nfe = prompt("NF-e:", item.nfe) || item.nfe;
      novosDados.sv = prompt("SV:", item.sv) || item.sv;
      novosDados.nome = prompt("Nome:", item.nome) || item.nome;
      novosDados.dataRegistro = prompt("Data Registro:", item.dataRegistro) || item.dataRegistro;
      novosDados.estado = prompt("Estado:", item.estado) || item.estado;
      novosDados.localizacao = prompt("Localização:", item.localizacao) || item.localizacao;
      novosDados.responsavel = prompt("Responsável (email):", item.responsavel) || item.responsavel;

      try {
        await set(ref(db, `ferramentais/${item.id}`), novosDados);

        let operador = novosDados.responsavel.split(".")[0] || novosDados.responsavel.split("@")[0] || novosDados.responsavel;
        operador = operador.charAt(0).toUpperCase() + operador.slice(1);

        const now = new Date();
        const data = now.toLocaleDateString("pt-BR");
        const hora = now.toLocaleTimeString("pt-BR", { hour: '2-digit', minute:'2-digit', second:'2-digit' });

        alert(`Registro alterado com sucesso por ${operador} em ${data} - ${hora}`);

        const snapshot = await get(ferramentaisRef);
        const dadosAtuais = snapshot.exists() ? snapshot.val() : {};
        const lista = Object.keys(dadosAtuais).map(key=>({id:key, ...dadosAtuais[key]}));
        exibirFerramentais(lista);

      } catch(err){
        console.error(err);
        alert("Erro ao atualizar os dados");
      }
    };

    // Botão Excluir
    tr.querySelector(".excluir").onclick = async () => {
      if(confirm("Deseja realmente excluir este registro?")){
        try {
          await remove(ref(db, `ferramentais/${item.id}`));
          tr.remove();
        } catch(err){ console.error(err); alert("Erro ao excluir"); }
      }
    };

    // Botão Gerar QR
    tr.querySelector(".qrcode").onclick = () => {
      const qrPlaceholder = tr.querySelector(".qr-placeholder");
      qrPlaceholder.innerHTML = "";
      const linkDetalhes = `${window.location.origin}/detalhes.html?id=${item.id}`;
      new QRCode(qrPlaceholder, { 
        text: linkDetalhes, 
        width: 300, 
        height: 300, 
        colorDark:"#000000", 
        colorLight:"#ffffff", 
        correctLevel: QRCode.CorrectLevel.H 
      });
    };

    // Botão Exportar QR
    tr.querySelector(".exportar").onclick = () => {
      const qrImg = tr.querySelector(".qr-placeholder img");
      if(qrImg){
        const a = document.createElement("a");
        a.href = qrImg.src;
        a.download = `${item.nome || 'qr-code'}.png`;
        a.click();
      } else {
        alert("Gere o QR Code antes de exportar.");
      }
    };

    tabela.appendChild(tr);
  });
}

document.getElementById("btnBuscar").onclick = async () => {
  const termo = document.getElementById("busca").value.toLowerCase();
  try {
    const snapshot = await get(ferramentaisRef);
    const dados = snapshot.exists() ? snapshot.val() : {};
    const lista = Object.keys(dados).map(key=>({id:key, ...dados[key]}));
    const filtrados = lista.filter(item=> item.sv?.toLowerCase().includes(termo) || item.nome?.toLowerCase().includes(termo) || item.nfe?.toLowerCase().includes(termo));
    filtrados.length ? exibirFerramentais(filtrados) : (alert("Nenhum ferramental encontrado"), tabela.innerHTML="");
  } catch(err){ console.error(err); alert("Erro ao buscar dados"); }
};

// Leitura de QR Code via câmera
const html5QrCode = new Html5Qrcode("qr-reader");
const qrContainer = document.createElement("div");
qrContainer.id = "qr-reader";
document.body.insertBefore(qrContainer, document.body.firstChild);

function startCameraScanner() {
  Html5Qrcode.getCameras().then(cameras => {
    if(cameras && cameras.length){
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        qrCodeMessage => { window.location.href = qrCodeMessage; }
      );
    }
  }).catch(err => console.error(err));
}
startCameraScanner();
</script>
</body>
</html>
