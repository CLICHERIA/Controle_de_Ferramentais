<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Ferramental</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    font-family: 'Orbitron', sans-serif;
    color: #fff;
  }

  .consult-box {
    background: rgba(0,0,0,0.85);
    padding: 3rem;
    border-radius: 12px;
    box-shadow: 0 0 20px #00f0ff, 0 0 40px #ff00ff inset;
    width: 400px;
    text-align: center;
  }

  h1 {
    margin-bottom: 2rem;
    color: #00f0ff;
    text-shadow: 0 0 10px #00f0ff;
  }

  input {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 1px solid #00f0ff;
    border-radius: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 1rem;
  }

  input::placeholder {
    color: #00f0ff;
    opacity: 0.7;
  }

  button {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 6px;
    background: linear-gradient(90deg, #00f0ff, #ff00ff);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: 0.3s;
  }

  button:hover {
    box-shadow: 0 0 20px #ff00ff, 0 0 40px #00f0ff;
  }

  .resultado {
    margin-top: 1.5rem;
    text-align: left;
    max-height: 200px;
    overflow-y: auto;
    background: rgba(0,0,0,0.5);
    padding: 1rem;
    border-radius: 6px;
    border: 1px solid #00f0ff;
  }

  a {
    display: block;
    margin-top: 1.5rem;
    color: #ff00ff;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
    text-shadow: 0 0 5px #ff00ff;
  }
</style>
</head>
<body>

<div class="consult-box">
  <h1>Consultar Ferramental</h1>
  <input type="text" id="search" placeholder="Digite nome ou código">
  <button id="btnConsultar">Consultar</button>
  <div class="resultado" id="resultado"></div>
  <a href="menu.html">Voltar ao Menu</a>
</div>

<script>
  const mockFerramentais = [
    {nome: "Chave de Fenda", codigo: "CF123"},
    {nome: "Martelo", codigo: "MRT456"},
    {nome: "Alicate", codigo: "AL789"},
  ];

  document.getElementById("btnConsultar").addEventListener("click", () => {
    const query = document.getElementById("search").value.toLowerCase();
    const resultadoDiv = document.getElementById("resultado");
    resultadoDiv.innerHTML = '';
    const filtrados = mockFerramentais.filter(f => 
      f.nome.toLowerCase().includes(query) || f.codigo.toLowerCase().includes(query)
    );
    if(filtrados.length > 0){
      filtrados.forEach(f => {
        resultadoDiv.innerHTML += `<p>${f.nome} - ${f.codigo}</p>`;
      });
    } else {
      resultadoDiv.innerHTML = '<p>Nenhum ferramental encontrado.</p>';
    }
  });
</script>

</body>
</html>
