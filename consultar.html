<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Ferramental</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }
    img.logo {
      width: 200px;
      filter: drop-shadow(0 0 8px #00eaff);
    }
    h1 {
      color: #00eaff;
      text-shadow: 0 0 20px #00eaff;
      text-align: center;
      margin: 20px 0;
    }
    form {
      background: #0d1b2a;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00eaff33;
      max-width: 500px;
      width: 90%;
    }
    label {
      display: block;
      margin-top: 15px;
      color: #00eaff;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #00eaff;
      background: #0a0f1a;
      color: #ffffff;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #0d1b2a;
      color: #00eaff;
      box-shadow:
        0 0 5px #00eaff,
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 40px #00eaff55;
      cursor: pointer;
      transition: 0.3s ease-in-out;
      animation: neonPulse 1.5s infinite alternate;
    }
    button:hover {
      color: #00ffff;
      box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 30px #00eaff,
        0 0 50px #00eaff77;
    }
    @keyframes neonPulse {
      0%, 100% {
        box-shadow:
          0 0 5px #00eaff,
          0 0 10px #00eaff,
          0 0 20px #00eaff;
      }
      50% {
        box-shadow:
          0 0 15px #00eaff,
          0 0 30px #00eaff,
          0 0 45px #00eaff77;
      }
    }
    a {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #00eaff;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Logo centralizada -->
  <div class="logo-container">
    <img src="../logosovel1337.png" alt="Logo Grupo Sovel da Amazônia" class="logo">
  </div>

  <h1>Consultar Ferramental</h1>

  <form id="formConsultar">
    <label for="sv">SV ou Código</label>
    <input type="text" id="sv" placeholder="Digite SV ou Código">

    <label for="cliente">Cliente</label>
    <input type="text" id="cliente" placeholder="Digite o cliente">

    <button type="submit">Consultar</button>
  </form>

  <a href="menu.html">← Voltar ao Menu</a>

</body>
</html>
