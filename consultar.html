<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Ferramentais</title>

<!-- ====================== -->
<!-- Estilo Futurista -->
<!-- ====================== -->
<style>
body {
  background-color: #0a0f1a;
  margin: 0;
  padding: 0;
  color: #ffffff;
  font-family: 'Segoe UI', sans-serif;
}
html, body {
  width: 100%;
  height: 100%;
}
a { color: #00eaff; text-decoration: none; }
.logo-container {
  display: flex;
  justify-content: center;
  margin-top: 30px;
  filter: drop-shadow(0 0 8px #00eaff);
}
img.logo { max-width: 200px; }
.centralizado { text-align: center; max-width: 900px; margin: 30px auto; }
input[type=text] {
  width: 60%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #00eaff55;
  background-color: #0a0f1a;
  color: #ffffff;
  font-size: 16px;
}
button {
  padding: 10px 20px;
  margin-left: 10px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background-color: #0d1b2a;
  color: #00eaff;
  box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
  transition: 0.3s ease-in-out;
}
button:hover { color: #00ffff; box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff; }
.card {
  background: #0d1b2a;
  border-radius: 15px;
  padding: 20px;
  margin: 15px auto;
  max-width: 700px;
  text-align: left;
  box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff44;
}
.card h3 { color: #00eaff; margin: 0 0 10px 0; }
.card p { margin: 0 0 10px 0; color: #c0dfff; }
.card .acoes { margin-top: 10px; display: flex; gap: 10px; }
canvas.qrcode { margin-top: 10px; }
</style>

</head>
<body>

<div class="logo-container">
  <img src="logosovel1337.png" alt="Logo Grupo Sovel da Amazônia" class="logo">
</div>

<div class="centralizado">
  <h1 style="color:#00eaff; text-shadow:0 0 20px #00eaff;">Consultar Ferramentais</h1>

  <div style="margin-bottom:20px;">
    <input type="text" id="buscar" placeholder="Digite SV ou Cliente...">
    <button onclick="buscarFerramentais()">Buscar</button>
    <button onclick="window.location.href='index.html'">Menu Principal</button>
  </div>

  <div id="resultados"></div>
</div>

<!-- QRCode.js Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<script>
// Mock de dados para exemplo
let dadosFerramentais = [
  { tipo: 'Faca', sv: 'A123', cliente: 'Cliente1', dataFabricacao: '2025-01-10', dataRegistro: '2025-11-03', responsavel: 'Samueldson' },
  { tipo: 'Clichê', sv: 'B456', cliente: 'Cliente2', dataFabricacao: '', dataRegistro: '2025-11-01', responsavel: 'Rafaelly' }
];

// Função de busca
function buscarFerramentais() {
  const query = document.getElementById('buscar').value.toLowerCase();
  const resultados = dadosFerramentais.filter(f => 
    f.sv.toLowerCase().includes(query) || f.cliente.toLowerCase().includes(query)
  );
  renderizarResultados(resultados);
}

// Renderizar resultados
function renderizarResultados(lista) {
  const container = document.getElementById('resultados');
  container.innerHTML = '';

  if(lista.length === 0) {
    container.innerHTML = '<p style="color:#c0dfff;">Nenhum ferramental encontrado.</p>';
    return;
  }

  lista.forEach(f => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>${f.tipo} - SV: ${f.sv}</h3>
      <p>Cliente: ${f.cliente}</p>
      <p>Data de Fabricação: ${f.dataFabricacao || 'Não informado'}</p>
      <p>Data de Registro: ${f.dataRegistro}</p>
      <p>Responsável: ${f.responsavel}</p>
      <div class="acoes">
        <button onclick="editarFerramental('${f.sv}')">Editar</button>
        <button onclick="excluirFerramental('${f.sv}')">Excluir</button>
        <button onclick="gerarQRCode('${f.sv}', this)">Gerar QR Code</button>
      </div>
      <div class="qrcode-container"></div>
    `;
    container.appendChild(card);
  });
}

// Funções de ação
function editarFerramental(sv) {
  alert('Editar: ' + sv);
}

function excluirFerramental(sv) {
  if(confirm('Deseja realmente excluir ' + sv + '?')) {
    dadosFerramentais = dadosFerramentais.filter(f => f.sv !== sv);
    buscarFerramentais();
  }
}

function gerarQRCode(sv, btn) {
  const container = btn.parentElement.nextElementSibling;
  container.innerHTML = ''; // limpa QR anterior
  const qrCanvas = document.createElement('canvas');
  container.appendChild(qrCanvas);

  // Gerar QR code com o texto do SV
  QRCode.toCanvas(qrCanvas, sv, { width: 200, margin: 2 }, function (error) {
    if(error) console.error(error);
    else {
      // Desenhar logo no centro
      const ctx = qrCanvas.getContext('2d');
      const logo = new Image();
      logo.src = 'logosovel1337.png';
      logo.onload = function() {
        const logoSize = qrCanvas.width * 0.25;
        const x = (qrCanvas.width - logoSize)/2;
        const y = (qrCanvas.height - logoSize)/2;
        ctx.drawImage(logo, x, y, logoSize, logoSize);
      };
    }
  });
}

</script>

</body>
</html>
