<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultar Ferramentais</title>

<style>
body {
    background-color: #0a0f1a;
    margin: 0;
    padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
}
html, body { width: 100%; height: 100%; }
a { color: #00eaff; text-decoration: none; }
.logo-container { text-align: center; margin-top: 40px; filter: drop-shadow(0 0 8px #00eaff); }
img.logo { width: 200px; }

.centralizado { max-width: 800px; margin: 40px auto; text-align: center; }
input { padding:10px; margin:5px; border-radius:8px; border:none; background:#0d1b2a; color:#00eaff; width:200px; }
button { padding:10px 20px; border:none; border-radius:8px; background:#0d1b2a; color:#00eaff; cursor:pointer; margin:5px; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { border:1px solid #00eaff; padding:8px; text-align:center; }
th { background:#0b1a2a; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
// TODO: Substitua com sua configuração do Firebase
const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_DOMINIO.firebaseapp.com",
    databaseURL: "https://SEU_DOMINIO.firebaseio.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_ID",
    appId: "SEU_APPID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function buscarFerramentais() {
    const tabela = document.getElementById('tabelaFerramentais');
    tabela.innerHTML = "<tr><th>Tipo</th><th>SV</th><th>Cliente</th><th>Data Fabricação</th><th>Data Registro</th><th>Responsável</th><th>Ações</th></tr>";
    db.ref('ferramentais').once('value', snapshot => {
        if(!snapshot.exists()){
            alert("Nenhum ferramental encontrado.");
            return;
        }
        snapshot.forEach(child => {
            const f = child.val();
            const tr = document.createElement('tr');

            tr.innerHTML = `
            <td>${f.tipo}</td>
            <td>${f.sv}</td>
            <td>${f.cliente}</td>
            <td>${f.dataFabricacao || ''}</td>
            <td>${f.dataRegistro}</td>
            <td>${f.responsavel}</td>
            <td>
                <button onclick="editarFerramental('${child.key}')">Editar</button>
                <button onclick="excluirFerramental('${child.key}')">Excluir</button>
                <button onclick="gerarQRCode('${child.key}')">QR Code</button>
            </td>
            `;
            tabela.appendChild(tr);
        });
    });
}

function editarFerramental(key){
    const cliente = prompt("Digite o novo cliente:");
    const dataRegistro = prompt("Digite a nova data de registro (AAAA-MM-DD):");
    if(cliente && dataRegistro){
        db.ref('ferramentais/' + key).update({cliente, dataRegistro}, err=>{
            if(err) alert("Erro ao atualizar!");
            else buscarFerramentais();
        });
    }
}

function excluirFerramental(key){
    if(confirm("Deseja realmente excluir este ferramental?")){
        db.ref('ferramentais/' + key).remove(err=>{
            if(err) alert("Erro ao excluir!");
            else buscarFerramentais();
        });
    }
}

function gerarQRCode(key){
    db.ref('ferramentais/' + key).once('value', snap=>{
        const f = snap.val();
        const dados = `
Tipo: ${f.tipo}
SV: ${f.sv}
Cliente: ${f.cliente}
Data Fabricação: ${f.dataFabricacao || ''}
Data Registro: ${f.dataRegistro}
Responsável: ${f.responsavel}
`;
        const modal = document.createElement('div');
        modal.style.position="fixed";
        modal.style.top="0"; modal.style.left="0";
        modal.style.width="100%"; modal.style.height="100%";
        modal.style.background="rgba(0,0,0,0.8)";
        modal.style.display="flex"; modal.style.justifyContent="center"; modal.style.alignItems="center";
        modal.style.flexDirection="column";
        modal.onclick = ()=>modal.remove();

        const canvas = document.createElement('canvas');
        QRCode.toCanvas(canvas, dados, {width:300}, function(error){ if(error) console.error(error); });
        modal.appendChild(canvas);

        const btnDownload = document.createElement('button');
        btnDownload.textContent = "Baixar PNG";
        btnDownload.onclick = (e)=>{
            e.stopPropagation();
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = canvas.toDataURL();
            link.click();
        };
        modal.appendChild(btnDownload);
        document.body.appendChild(modal);
    });
}
</script>
</head>
<body>

<div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
</div>

<div class="centralizado">
    <h2>Consultar Ferramentais</h2>
    <button onclick="buscarFerramentais()">Buscar Todos</button>
    <table id="tabelaFerramentais">
        <tr><th>Tipo</th><th>SV</th><th>Cliente</th><th>Data Fabricação</th><th>Data Registro</th><th>Responsável</th><th>Ações</th></tr>
    </table>
    <a href="menu.html" class="neon-button">Voltar ao Menu</a>
</div>

</body>
</html>
