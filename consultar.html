<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultar Ferramentais — SGF</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #e0faff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #00eaff;
      text-shadow: 0 0 10px #00eaffaa;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #0d1524;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 20px #00eaff22;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #00eaff33;
    }

    th {
      color: #00eaff;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* === Estilo SGF para agrupamentos === */
    .linha-nfe {
      background: rgba(0, 234, 255, 0.07);
      color: #00eaff;
      font-weight: 600;
      transition: background 0.3s;
    }

    .linha-nfe:hover {
      background: rgba(0, 234, 255, 0.15);
    }

    .botao-expandir {
      background: transparent;
      border: 1px solid #00eaff88;
      color: #00eaff;
      padding: 4px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
      box-shadow: 0 0 8px #00eaff44;
    }

    .botao-expandir:hover {
      background: #00eaff22;
      box-shadow: 0 0 15px #00eaff77;
    }

    .subtabela {
      background: #0a0f1a;
      border: 1px solid #00eaff33;
      border-radius: 10px;
      padding: 12px;
      box-shadow: 0 0 20px #00eaff22 inset;
      animation: fadeIn 0.3s ease-in-out;
    }

    .tabela-interna {
      width: 100%;
      border-collapse: collapse;
      color: #e0faff;
      font-size: 14px;
    }

    .tabela-interna th {
      text-align: left;
      padding: 6px;
      border-bottom: 1px solid #00eaff44;
      color: #00eaff;
    }

    .tabela-interna td {
      padding: 6px;
      border-bottom: 1px solid #00eaff22;
    }

    .botao-acao {
      background: transparent;
      border: 1px solid #00eaff55;
      color: #00eaff;
      padding: 3px 8px;
      margin: 2px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .botao-acao:hover {
      background: #00eaff22;
      box-shadow: 0 0 8px #00eaff88;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scaleY(0.95); }
      to { opacity: 1; transform: scaleY(1); }
    }

    /* Modal de QRCode */
    #qrModal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
    }

    #qrModal img {
      border: 3px solid #00eaff;
      border-radius: 12px;
      box-shadow: 0 0 25px #00eaff;
      background: #0a0f1a;
      padding: 10px;
    }

    #qrModal button {
      position: absolute;
      top: 20px;
      right: 30px;
      background: #00eaff;
      border: none;
      color: #0a0f1a;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    #qrModal button:hover {
      background: #00ffff;
    }
  </style>
</head>

<body>
  <h1>Consultar Ferramentais</h1>
  <table id="tabelaFerramentais"></table>

  <!-- Modal de QRCode -->
  <div id="qrModal">
    <button onclick="fecharModal()">Fechar</button>
    <img id="qrImagem" src="" alt="QR Code" />
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <script>
    // Dados de exemplo (substitui pelo retorno real do banco)
    const dados = [
      {
        id: "1",
        nfe: "12345",
        tipo: "Clichê",
        nome: "Ferramental de Teste A",
        responsavel: "Carlos",
        sv: "SV001",
        dataRegistro: "2025-11-03",
        estado: "Em uso",
        localizacao: "Produção"
      },
      {
        id: "2",
        nfe: "12345",
        tipo: "Clichê",
        nome: "Ferramental de Teste B",
        responsavel: "Carlos",
        sv: "SV002",
        dataRegistro: "2025-11-03",
        estado: "Em uso",
        localizacao: "Produção"
      },
      {
        id: "3",
        nfe: "78910",
        tipo: "Matriz",
        nome: "Ferramental de Teste C",
        responsavel: "João",
        sv: "SV003",
        dataRegistro: "2025-11-04",
        estado: "Disponível",
        localizacao: "Armazém"
      }
    ];

    function exibirFerramentais(dados) {
      const tabela = document.getElementById("tabelaFerramentais");
      tabela.innerHTML = "";

      const grupos = {};
      dados.forEach(item => {
        if (!grupos[item.nfe]) grupos[item.nfe] = [];
        grupos[item.nfe].push(item);
      });

      Object.keys(grupos).forEach(nfe => {
        const itens = grupos[nfe];
        const primeiro = itens[0];

        const trGrupo = document.createElement("tr");
        trGrupo.classList.add("linha-nfe");
        trGrupo.innerHTML = `
          <td>${primeiro.tipo || ""}</td>
          <td>${nfe}</td>
          <td colspan="5">${primeiro.nome || ""}</td>
          <td>${primeiro.responsavel || ""}</td>
          <td>
            <button class="botao-expandir">
              <span class="icone">➕</span> Ver itens (${itens.length})
            </button>
          </td>
        `;
        tabela.appendChild(trGrupo);

        const trDetalhes = document.createElement("tr");
        const tdDetalhes = document.createElement("td");
        tdDetalhes.colSpan = 9;
        tdDetalhes.innerHTML = `
          <div class="subtabela">
            <table class="tabela-interna">
              <thead>
                <tr>
                  <th>SV</th>
                  <th>Nome</th>
                  <th>Data Registro</th>
                  <th>Estado</th>
                  <th>Localização</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                ${itens.map(item => `
                  <tr>
                    <td>${item.sv}</td>
                    <td>${item.nome}</td>
                    <td>${item.dataRegistro}</td>
                    <td>${item.estado}</td>
                    <td>${item.localizacao}</td>
                    <td>
                      <button class="botao-acao editar" data-id="${item.id}">Editar</button>
                      <button class="botao-acao excluir" data-id="${item.id}">Excluir</button>
                      <button class="botao-acao qrcode" data-id="${item.id}">QRCODE</button>
                      <button class="botao-acao exportar" data-id="${item.id}">Exportar</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
        trDetalhes.style.display = "none";
        trDetalhes.appendChild(tdDetalhes);
        tabela.appendChild(trDetalhes);

        const botaoExpandir = trGrupo.querySelector(".botao-expandir");
        botaoExpandir.onclick = () => {
          const visivel = trDetalhes.style.display === "table-row";
          trDetalhes.style.display = visivel ? "none" : "table-row";
          botaoExpandir.innerHTML = visivel
            ? `<span class="icone">➕</span> Ver itens (${itens.length})`
            : `<span class="icone">➖</span> Recolher itens`;
        };

        // Ativa botões
        tdDetalhes.querySelectorAll(".qrcode").forEach(btn =>
          btn.addEventListener("click", () => gerarQRCode(btn.dataset.id))
        );
        tdDetalhes.querySelectorAll(".exportar").forEach(btn =>
          btn.addEventListener("click", () => exportarFerramental(btn.dataset.id))
        );
      });
    }

    // Função QRCode
    function gerarQRCode(id) {
      const item = dados.find(f => f.id === id);
      const qr = new QRious({
        value: `Ferramental: ${item.nome}\nSV: ${item.sv}\nNF-e: ${item.nfe}`,
        size: 220,
        background: "#0a0f1a",
        foreground: "#00eaff"
      });

      document.getElementById("qrImagem").src = qr.toDataURL();
      document.getElementById("qrModal").style.display = "flex";
    }

    function fecharModal() {
      document.getElementById("qrModal").style.display = "none";
    }

    // Função exportar (com logo e borda branca)
    function exportarFerramental(id) {
      const item = dados.find(f => f.id === id);
      const janela = window.open("", "_blank");
      janela.document.write(`
        <html>
          <head><title>Exportação — ${item.sv}</title></head>
          <body style="background:white; color:black; text-align:center; font-family:Segoe UI;">
            <div style="border:3px solid black; margin:40px; padding:30px; border-radius:15px;">
              <img src="assets/img/logosovel133.png" style="width:130px; display:block; margin:0 auto 20px auto;">
              <h2>Ferramental ${item.nome}</h2>
              <p><b>SV:</b> ${item.sv}</p>
              <p><b>NF-e:</b> ${item.nfe}</p>
              <p><b>Tipo:</b> ${item.tipo}</p>
              <p><b>Responsável:</b> ${item.responsavel}</p>
              <p><b>Estado:</b> ${item.estado}</p>
              <p><b>Localização:</b> ${item.localizacao}</p>
            </div>
          </body>
        </html>
      `);
      janela.document.close();
      janela.print();
    }

    exibirFerramentais(dados);
  </script>
</body>
</html>
