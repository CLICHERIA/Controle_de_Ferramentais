<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consultar Ferramentais — Grupo Sovel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #0e1620;
      --text-primary: #e6eef6;
      --text-muted: #99a3ad;
      --accent-primary: #1e88e5;
      --accent-secondary: #0ea5a4;
      --accent-hover: #0fb6c6;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    .search-container {
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
    }

    .search-container input {
      width: 100%;
      padding: 0.875rem 1rem;
      border-radius: var(--border-radius);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(8, 22, 27, 0.8);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    .search-container input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(30,136,229,0.15);
    }

    table {
      width: 100%;
      max-width: 900px;
      border-collapse: collapse;
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    th, td {
      padding: 1rem;
      text-align: left;
      font-size: 0.95rem;
    }

    th {
      background-color: #102030;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .actions button {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      color: #021018;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      margin-right: 0.4rem;
    }

    .actions button:hover {
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
      transform: translateY(-2px);
    }

    .back-link {
      margin-top: 2rem;
      color: var(--accent-primary);
      text-decoration: none;
      transition: var(--transition);
      font-weight: 500;
      text-align: center;
      display: block;
    }

    .back-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 2rem 0 0;
      width: 100%;
    }

    .no-results {
      color: var(--text-muted);
      text-align: center;
      margin-top: 1rem;
    }

    /* Modal de edição */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .modal-content {
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-content h2 {
      margin-bottom: 1rem;
      color: var(--accent-primary);
    }

    .modal-content input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background-color: rgba(8, 22, 27, 0.8);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    .modal-content input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(30,136,229,0.15);
    }

    .modal-content button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #021018;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .modal-content button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <header>
    <h1>Consultar Ferramentais</h1>
    <p>Pesquise, edite ou exclua ferramentais cadastrados.</p>
  </header>

  <div class="search-container">
    <input type="text" id="search" placeholder="Buscar por código ou nome..." />
  </div>

  <table id="tabelaFerramentais">
    <thead>
      <tr>
        <th>Código</th>
        <th>Nome</th>
        <th>Status</th>
        <th>Local</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="listaFerramentais"></tbody>
  </table>

  <p class="no-results" id="noResults" style="display:none;">Nenhum ferramental encontrado.</p>

  <a href="menu.html" class="back-link">← Voltar ao Menu</a>

  <footer>© 2025 Grupo Sovel da Amazônia</footer>

  <!-- Modal de Edição -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Editar Ferramental</h2>
      <input type="text" id="editCodigo" placeholder="Código" readonly />
      <input type="text" id="editNome" placeholder="Nome" />
      <input type="text" id="editStatus" placeholder="Status" />
      <input type="text" id="editLocal" placeholder="Local" />
      <button id="salvarEdicao">Salvar Alterações</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { 
      getFirestore, collection, getDocs, doc, deleteDoc, updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const lista = document.getElementById("listaFerramentais");
    const searchInput = document.getElementById("search");
    const noResults = document.getElementById("noResults");
    const editModal = document.getElementById("editModal");
    const salvarBtn = document.getElementById("salvarEdicao");

    let ferramentais = [];
    let ferramentalSelecionado = null;

    async function carregarFerramentais() {
      lista.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Carregando...</td></tr>";
      const querySnapshot = await getDocs(collection(db, "ferramentais"));
      ferramentais = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderTabela(ferramentais);
    }

    function renderTabela(dados) {
      lista.innerHTML = "";
      if (dados.length === 0) {
        noResults.style.display = "block";
        return;
      }
      noResults.style.display = "none";
      dados.forEach(f => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${f.codigo}</td>
          <td>${f.nome}</td>
          <td>${f.status}</td>
          <td>${f.local}</td>
          <td class="actions">
            <button onclick="editarFerramental('${f.id}')">Editar</button>
            <button onclick="excluirFerramental('${f.id}')">Excluir</button>
          </td>
        `;
        lista.appendChild(tr);
      });
    }

    searchInput.addEventListener("input", e => {
      const termo = e.target.value.toLowerCase();
      const filtrados = ferramentais.filter(f =>
        f.codigo.toLowerCase().includes(termo) ||
        f.nome.toLowerCase().includes(termo)
      );
      renderTabela(filtrados);
    });

    window.excluirFerramental = async (id) => {
      if (confirm("Deseja excluir este ferramental?")) {
        await deleteDoc(doc(db, "ferramentais", id));
        alert("Ferramental excluído com sucesso!");
        carregarFerramentais();
      }
    };

    window.editarFerramental = (id) => {
      ferramentalSelecionado = ferramentais.find(f => f.id === id);
      document.getElementById("editCodigo").value = ferramentalSelecionado.codigo;
      document.getElementById("editNome").value = ferramentalSelecionado.nome;
      document.getElementById("editStatus").value = ferramentalSelecionado.status;
      document.getElementById("editLocal").value = ferramentalSelecionado.local;
      editModal.style.display = "flex";
    };

    salvarBtn.addEventListener("click", async () => {
      if (!ferramentalSelecionado) return;
      const ref = doc(db, "ferramentais", ferramentalSelecionado.id);
      await updateDoc(ref, {
        nome: document.getElementById("editNome").value,
        status: document.getElementById("editStatus").value,
        local: document.getElementById("editLocal").value,
      });
      alert("Ferramental atualizado com sucesso!");
      editModal.style.display = "none";
      carregarFerramentais();
    });

    window.onclick = (e) => {
      if (e.target === editModal) editModal.style.display = "none";
    };

    carregarFerramentais();
  </script>
</body>
</html>
