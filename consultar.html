<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Ferramentais - SGF</title>
<style>
  body {
    background-color: #0a0f1a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    text-align: center;
  }
  h1 {
    color: #00eaff;
    text-shadow: 0 0 5px #00eaff;
  }
  input, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin: 5px;
  }
  input { width: 300px; }
  button {
    cursor: pointer;
    font-weight: bold;
    color: #00eaff;
    background-color: #0d1b2a;
    box-shadow: 0 0 5px #00eaff;
    transition: all 0.3s;
  }
  button:hover {
    color: #00ffff;
    box-shadow: 0 0 10px #00eaff;
  }
  table {
    width: 100%;
    max-width: 1200px;
    border-collapse: collapse;
    margin: 20px auto;
    background-color: #0d1b2a;
    border-radius: 10px;
    box-shadow: 0 0 20px #00eaff22;
  }
  th, td {
    border: 1px solid #00eaff44;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
  }
  th { background-color: #091224; color: #00eaff; }

  .linha-nfe {
    background: rgba(0, 234, 255, 0.07);
    color: #00eaff;
    font-weight: 600;
    transition: background 0.3s;
  }
  .linha-nfe:hover {
    background: rgba(0, 234, 255, 0.15);
  }
  .botao-expandir {
    background: transparent;
    border: 1px solid #00eaff88;
    color: #00eaff;
    padding: 4px 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
    box-shadow: 0 0 8px #00eaff44;
  }
  .botao-expandir:hover {
    background: #00eaff22;
    box-shadow: 0 0 15px #00eaff77;
  }
  .subtabela {
    background: #0a0f1a;
    border: 1px solid #00eaff33;
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 0 20px #00eaff22 inset;
  }
  .tabela-interna {
    width: 100%;
    border-collapse: collapse;
    color: #e0faff;
    font-size: 14px;
  }
  .tabela-interna th {
    text-align: left;
    padding: 6px;
    border-bottom: 1px solid #00eaff44;
    color: #00eaff;
  }
  .tabela-interna td {
    padding: 6px;
    border-bottom: 1px solid #00eaff22;
  }
  .botao-acao {
    background: transparent;
    border: 1px solid #00eaff55;
    color: #00eaff;
    padding: 3px 8px;
    margin: 2px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .botao-acao:hover {
    background: #00eaff22;
    box-shadow: 0 0 8px #00eaff88;
  }
  .icone {
    font-weight: bold;
    margin-right: 5px;
  }
</style>
</head>
<body>
<h1>Consulta de Ferramentais</h1>

<div class="top-buttons">
  <input type="text" id="busca" placeholder="Digite SV, Nome ou NF-e">
  <button id="btnBuscar">Buscar</button>
  <button id="btnVoltarMenu">Voltar ao Menu</button>
</div>

<table>
<thead>
<tr>
  <th>Tipo</th><th>NF-e</th><th>Nome</th><th colspan="3">Resumo</th><th>Responsável</th><th>Ações</th>
</tr>
</thead>
<tbody id="tabelaFerramentais"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
  import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
    authDomain: "dacsovel-53481.firebaseapp.com",
    databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
    projectId: "dacsovel-53481",
    storageBucket: "dacsovel-53481.appspot.com",
    messagingSenderId: "37867522513",
    appId: "1:37867522513:web:336d687e3fc8408bd138f0",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ferramentaisRef = ref(db, "ferramentais");
  const tabela = document.getElementById("tabelaFerramentais");
  const btnBuscar = document.getElementById("btnBuscar");
  const btnVoltar = document.getElementById("btnVoltarMenu");

  btnVoltar.onclick = () => window.location.href = "menu.html";

  btnBuscar.onclick = async () => {
    const termo = document.getElementById("busca").value.toLowerCase();
    const snapshot = await get(ferramentaisRef);
    const lista = snapshot.exists()
      ? Object.keys(snapshot.val()).map(key => ({ id: key, ...snapshot.val()[key] }))
      : [];
    const filtrados = lista.filter(item =>
      (item.sv && item.sv.toLowerCase().includes(termo)) ||
      (item.nome && item.nome.toLowerCase().includes(termo)) ||
      (item.nfe && item.nfe.toLowerCase().includes(termo))
    );
    if (filtrados.length) exibirFerramentais(filtrados);
    else tabela.innerHTML = "<tr><td colspan='8'>Nenhum ferramental encontrado</td></tr>";
  };

  function exibirFerramentais(dados) {
    tabela.innerHTML = "";
    const grupos = {};
    dados.forEach(item => {
      if (!grupos[item.nfe]) grupos[item.nfe] = [];
      grupos[item.nfe].push(item);
    });

    Object.keys(grupos).forEach(nfe => {
      const itens = grupos[nfe];
      const primeiro = itens[0];
      const trGrupo = document.createElement("tr");
      trGrupo.classList.add("linha-nfe");
      trGrupo.innerHTML = `
        <td>${primeiro.tipo || ""}</td>
        <td>${nfe}</td>
        <td colspan="3">${primeiro.nome || ""}</td>
        <td>${primeiro.estado || ""}</td>
        <td>${primeiro.responsavel || ""}</td>
        <td>
          <button class="botao-expandir"><span class="icone">➕</span> Ver itens (${itens.length})</button>
        </td>
      `;
      tabela.appendChild(trGrupo);

      const trDetalhes = document.createElement("tr");
      const tdDetalhes = document.createElement("td");
      tdDetalhes.colSpan = 8;
      tdDetalhes.innerHTML = `
        <div class="subtabela">
          <table class="tabela-interna">
            <thead>
              <tr>
                <th>SV</th><th>Nome</th><th>Data Registro</th><th>Estado</th><th>Localização</th><th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${itens.map(item => `
                <tr>
                  <td>${item.sv || ""}</td>
                  <td>${item.nome || ""}</td>
                  <td>${item.dataRegistro || ""}</td>
                  <td>${item.estado || ""}</td>
                  <td>${item.localizacao || ""}</td>
                  <td>
                    <button class="botao-acao editar" data-id="${item.id}">Editar</button>
                    <button class="botao-acao excluir" data-id="${item.id}">Excluir</button>
                    <button class="botao-acao qrcode" data-id="${item.id}">QR</button>
                    <button class="botao-acao exportar" data-id="${item.id}">Exportar</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
      trDetalhes.style.display = "none";
      trDetalhes.appendChild(tdDetalhes);
      tabela.appendChild(trDetalhes);

      const botaoExpandir = trGrupo.querySelector(".botao-expandir");
      botaoExpandir.onclick = () => {
        const visivel = trDetalhes.style.display === "table-row";
        trDetalhes.style.display = visivel ? "none" : "table-row";
        botaoExpandir.innerHTML = visivel
          ? `<span class="icone">➕</span> Ver itens (${itens.length})`
          : `<span class="icone">➖</span> Recolher itens`;
      };

      // ✅ Liga os eventos aos botões internos
      tdDetalhes.querySelectorAll(".editar").forEach(btn => {
        btn.onclick = () => window.location.href = `editar.html?id=${btn.dataset.id}`;
      });

      tdDetalhes.querySelectorAll(".excluir").forEach(btn => {
        btn.onclick = async () => {
          if (confirm("Deseja realmente excluir este registro?")) {
            await remove(ref(db, `ferramentais/${btn.dataset.id}`));
            btn.closest("tr").remove();
          }
        };
      });

      tdDetalhes.querySelectorAll(".qrcode").forEach(btn => {
        btn.onclick = () => gerarQRCode(btn.dataset.id);
      });

      tdDetalhes.querySelectorAll(".exportar").forEach(btn => {
        btn.onclick = () => exportarQRCode(btn.dataset.id);
      });
    });
  }

  // 🔹 QR Code unificado
  function gerarQRCode(id) {
    const link = `${window.location.origin}/SGF/detalhes.html?id=${id}`;
    const canvas = document.createElement("canvas");
    new QRCode(canvas, { text: link, width: 256, height: 256 });
    document.body.appendChild(canvas);
    setTimeout(() => canvas.remove(), 1000);
  }

  function exportarQRCode(id) {
    const link = `${window.location.origin}/SGF/detalhes.html?id=${id}`;
    const temp = document.createElement("div");
    new QRCode(temp, { text: link, width: 300, height: 300 });
    setTimeout(() => {
      const img = temp.querySelector("img");
      const a = document.createElement("a");
      a.href = img.src;
      a.download = `QR_${id}.png`;
      a.click();
      temp.remove();
    }, 300);
  }
</script>
</body>
</html>
