<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Consultar</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    #qrcode {
      margin-top: 20px;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Consultar</h1>
  <p>Clique no botão para gerar o QR Code deste arquivo:</p>
  <button id="generateBtn">Gerar QR Code</button>
  <div id="qrcode"></div>
  <button id="exportBtn">Exportar QR Code</button>

  <script>
    let qrcode; // Variável global para armazenar o QR Code

    document.getElementById("generateBtn").addEventListener("click", () => {
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = ""; // Limpa QR Code anterior, se existir

      // URL completa do arquivo consultar.html na raiz
      const url = window.location.origin + '/consultar.html';

      // Gera o QR Code com borda branca
      qrcode = new QRCode(qrContainer, {
        text: url,
        width: 200,
        height: 200,
        colorDark: "#000000",
        colorLight: "#ffffff", // Borda branca
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      if (!qrcode) {
        alert("Primeiro gere o QR Code!");
        return;
      }
      const canvas = document.querySelector('#qrcode canvas');
      if (canvas) {
        const link = document.createElement('a');
        link.href = canvas.toDataURL("image/png");
        link.download = 'consultar_qrcode.png';
        link.click();
      } else {
        alert("Erro: QR Code não encontrado.");
      }
    });
  </script>
</body>
</html>
