<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
    authDomain: "dacsovel-53481.firebaseapp.com",
    databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
    projectId: "dacsovel-53481",
    storageBucket: "dacsovel-53481.appspot.com",
    messagingSenderId: "37867522513",
    appId: "1:37867522513:web:336d687e3fc8408bd138f0",
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  document.addEventListener("DOMContentLoaded", () => {
    const botaoConsultar = document.querySelector(".botoes-topo button");
    if (botaoConsultar) botaoConsultar.addEventListener("click", carregarFerramentais);
  });

  async function carregarFerramentais() {
    const tabela = document.getElementById("tabela").querySelector("tbody");
    tabela.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#00eaff;">Carregando dados...</td></tr>`;

    try {
      const snapshot = await get(ref(db, "ferramentais"));
      if (!snapshot.exists()) {
        tabela.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#00eaff99;">Nenhum ferramental encontrado.</td></tr>`;
        return;
      }

      const dados = Object.entries(snapshot.val()).map(([id, valor]) => ({ id, ...valor }));
      exibirFerramentais(dados);
    } catch (err) {
      console.error(err);
      tabela.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#ff5555;">Erro ao carregar dados.</td></tr>`;
    }
  }

  function primeiroNome(email) {
    if (!email) return "";
    const nome = email.split("@")[0].split(".")[0];
    return nome.charAt(0).toUpperCase() + nome.slice(1);
  }

  function exibirFerramentais(dados) {
    const tabela = document.getElementById("tabela").querySelector("tbody");
    tabela.innerHTML = "";

    const grupos = {};
    dados.forEach(item => {
      const sv = item.sv || "Sem SV";
      if (!grupos[sv]) grupos[sv] = [];
      grupos[sv].push(item);
    });

    Object.keys(grupos).forEach(sv => {
      const itens = grupos[sv];
      const primeiro = itens[0];
      const tipo = primeiro.tipo || "Desconhecido";

      const trGrupo = document.createElement("tr");
      trGrupo.classList.add("linha-sv");
      trGrupo.innerHTML = `
        <td>${tipo}</td>
        <td>${sv}</td>
        <td>${primeiro.nome || ""}</td>
        <td>${primeiroNome(primeiro.responsavel)}</td>
        <td><button class="botao-expandir"><span class="icone">➕</span> Ver itens (${itens.length})</button></td>
      `;
      tabela.appendChild(trGrupo);

      const trDetalhes = document.createElement("tr");
      const tdDetalhes = document.createElement("td");
      tdDetalhes.colSpan = 5;
      tdDetalhes.innerHTML = `
        <div class="subtabela">
          <table class="tabela-interna">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Data Registro</th>
                <th>Estado</th>
                <th>Localização</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${itens.map(item => `
                <tr>
                  <td>${item.nome || ""}</td>
                  <td>${item.dataRegistro || ""}</td>
                  <td>${item.estado || ""}</td>
                  <td>${item.localizacao || ""}</td>
                  <td>
                    <button class="botao-acao editar" data-id="${item.id}">Editar</button>
                    <button class="botao-acao excluir" data-id="${item.id}">Excluir</button>
                    <button class="botao-acao qrcode" data-id="${item.id}">Gerar QR-Code</button>
                    <button class="botao-acao exportar" data-id="${item.id}">Exportar QR-Code</button>
                    <div class="qr-container" style="margin-top:5px;text-align:center;"></div>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>`;
      trDetalhes.style.display = "none";
      trDetalhes.appendChild(tdDetalhes);
      tabela.appendChild(trDetalhes);

      const botaoExpandir = trGrupo.querySelector(".botao-expandir");
      botaoExpandir.onclick = () => {
        const visivel = trDetalhes.style.display === "table-row";
        trDetalhes.style.display = visivel ? "none" : "table-row";
        botaoExpandir.innerHTML = visivel
          ? `<span class="icone">➕</span> Ver itens (${itens.length})`
          : `<span class="icone">➖</span> Recolher itens`;
      };

      tdDetalhes.querySelectorAll(".editar").forEach(btn => {
        btn.onclick = () => window.location.href = `editar.html?id=${btn.dataset.id}`;
      });

      tdDetalhes.querySelectorAll(".excluir").forEach(btn => {
        btn.onclick = async () => {
          if (confirm("Deseja realmente excluir este registro?")) {
            await remove(ref(db, `ferramentais/${btn.dataset.id}`));
            carregarFerramentais();
          }
        };
      });

      tdDetalhes.querySelectorAll(".qrcode").forEach(btn => {
        btn.onclick = () => gerarQRCode(btn);
      });

      tdDetalhes.querySelectorAll(".exportar").forEach(btn => {
        btn.onclick = () => exportarQRCode(btn);
      });
    });
  }

  // === QR-CODE CORRIGIDO ===
  function gerarQRCode(botao) {
    const id = botao.dataset.id;
    const container = botao.parentNode.querySelector(".qr-container");
    container.innerHTML = "";
    const link = `${window.location.origin}/SGF/detalhes.html?id=${id}`;

    const qr = new QRCode(container, {
      text: link,
      width: 180,
      height: 180,
      colorDark: "#00eaff",
      colorLight: "#0a0f1a",
      correctLevel: QRCode.CorrectLevel.H
    });

    // Garante que a imagem aparece
    setTimeout(() => {
      const img = container.querySelector("img");
      if (img) {
        img.style.display = "block";
        img.style.margin = "10px auto";
        img.style.border = "1px solid #00eaff33";
        img.style.borderRadius = "10px";
        img.style.boxShadow = "0 0 15px #00eaff55";
      }
    }, 200);
  }

  function exportarQRCode(botao) {
    const container = botao.parentNode.querySelector(".qr-container");
    const img = container.querySelector("img") || container.querySelector("canvas");
    if (!img) return alert("Gere o QR-Code primeiro!");

    const a = document.createElement("a");
    a.href = img.src || img.toDataURL("image/png");
    a.download = `QRCode_${botao.dataset.id}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
</script>
