<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Consultar Ferramentais</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center;}
.centralizado { width:800px; margin:30px auto; background:#222; padding:20px; border-radius:10px;}
input { width:90%; margin:10px 0; padding:8px; border-radius:5px; border:none;}
button { padding:5px 10px; margin:2px; border:none; border-radius:5px; background:#00bfff; color:#111; font-weight:bold; cursor:pointer;}
button:hover { background:#00e0ff; }
img.logo { width:150px; margin-bottom:20px; display:block; margin-left:auto; margin-right:auto; }
table { width:100%; margin-top:20px; border-collapse: collapse;}
th, td { border:1px solid #fff; padding:5px;}
</style>
</head>
<body>

<div class="centralizado">
    <img src="logosovel1337.png" alt="Logo" class="logo">
    <h2>Consultar Ferramentais</h2>

    <input type="text" id="buscar" placeholder="Buscar por SV ou Cliente">
    <button onclick="buscarFerramental()">Buscar</button>
    <button onclick="window.location.href='menu.html'">Menu Principal</button>

    <table id="tabela">
        <thead>
            <tr><th>Tipo</th><th>SV</th><th>Cliente</th><th>Data Fabricação</th><th>Data Registro</th><th>Responsável</th><th>Ações</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
firebase.initializeApp(firebaseConfig);

firebase.auth().onAuthStateChanged(user=>{
    if(!user) window.location.href="index.html";
});

function buscarFerramental(){
    const filtro = document.getElementById('buscar').value.toLowerCase();
    const tbody = document.querySelector('#tabela tbody');
    tbody.innerHTML = '';

    firebase.database().ref('ferramentais').once('value', snap=>{
        const data = snap.val();
        let encontrado = false;
        for(const key in data){
            const f = data[key];
            if(f.sv.toLowerCase().includes(filtro) || f.cliente.toLowerCase().includes(filtro) || filtro==''){
                encontrado = true;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${f.tipo}</td>
                    <td>${f.sv}</td>
                    <td>${f.cliente}</td>
                    <td>${f.dataFabricacao || ''}</td>
                    <td>${f.dataRegistro}</td>
                    <td>${f.responsavel}</td>
                    <td>
                        <button onclick='editarFerramental("${key}")'>Editar</button>
                        <button onclick='excluirFerramental("${key}")'>Excluir</button>
                        <button onclick='gerarQR("${key}")'>QR Code</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }
        if(!encontrado) tbody.innerHTML='<tr><td colspan="7">Nenhum ferramental encontrado</td></tr>';
    });
}

function editarFerramental(key){
    const f = prompt("Novo cliente:");
    const dr = prompt("Nova data de registro (YYYY-MM-DD):");
    if(f && dr){
        firebase.database().ref('ferramentais/'+key).update({cliente:f, dataRegistro:dr});
        alert("Alterações salvas!");
        buscarFerramental();
    }
}

function excluirFerramental(key){
    if(confirm("Deseja excluir este ferramental?")){
        firebase.database().ref('ferramentais/'+key).remove();
        buscarFerramental();
    }
}

function gerarQR(key){
    firebase.database().ref('ferramentais/'+key).once('value', snap=>{
        const f = snap.val();
        const dados = `Tipo: ${f.tipo}\nSV: ${f.sv}\nCliente: ${f.cliente}\nData Fab: ${f.dataFabricacao||''}\nData Reg: ${f.dataRegistro}\nResponsável: ${f.responsavel}`;
        const qrWindow = window.open("", "QR Code", "width=300,height=300");
        qrWindow.document.write(`<h3>QR Code</h3><canvas id="qrcode"></canvas><br><button onclick="download()">Download PNG</button>
        <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
        <script>
        QRCode.toCanvas(document.getElementById("qrcode"), \`${dados}\`, function (error) {
            if (error) console.error(error);
        });
        function download(){
            const canvas = document.getElementById("qrcode");
            const link = document.createElement("a");
            link.href = canvas.toDataURL("image/png");
            link.download = "qrcode.png";
            link.click();
        }
        </script>`);
    });
}
</script>

</body>
</html>
