<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Registrar Ferramental</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center;}
.centralizado { width:400px; margin:50px auto; background:#222; padding:30px; border-radius:10px;}
input, select { width:90%; margin:10px 0; padding:8px; border-radius:5px; border:none;}
button { width:95%; padding:10px; border:none; border-radius:5px; background:#00bfff; color:#111; font-weight:bold; cursor:pointer;}
button:hover { background:#00e0ff; }
img.logo { width:150px; margin-bottom:20px; display:block; margin-left:auto; margin-right:auto; }
</style>
</head>
<body>

<div class="centralizado">
    <img src="logosovel1337.png" alt="Logo" class="logo">
    <h2>Registrar Ferramental</h2>

    <select id="tipo">
        <option value="">Selecione Tipo</option>
        <option value="faca">Faca</option>
        <option value="cliche">Clichê</option>
    </select>
    <input type="text" id="sv" placeholder="SV (letra e número)">
    <input type="text" id="cliente" placeholder="Cliente">
    <input type="date" id="dataFabricacao" placeholder="Data de Fabricação (opcional)">
    <input type="date" id="dataRegistro" placeholder="Data de Registro">
    <input type="text" id="responsavel" placeholder="Responsável pelo registro">

    <button id="btnRegistrar">Registrar</button>
    <button onclick="window.location.href='menu.html'">Menu Principal</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
firebase.initializeApp(firebaseConfig);

// Verifica se usuário está logado
firebase.auth().onAuthStateChanged(user => {
    if (!user) {
        alert("Faça login primeiro!");
        window.location.href = "index.html";
    }


document.getElementById('btnRegistrar').addEventListener('click', () => {
    const tipo = document.getElementById('tipo').value;
    const sv = document.getElementById('sv').value.trim();
    const cliente = document.getElementById('cliente').value.trim();
    const dataFabricacao = document.getElementById('dataFabricacao').value;
    const dataRegistro = document.getElementById('dataRegistro').value;
    const responsavel = document.getElementById('responsavel').value.trim();

    if (!tipo || !sv || !cliente || !dataRegistro || !responsavel) {
        alert("Preencha todos os campos obrigatórios!");
        return;
    }

    const novoFerramental = {
        tipo,
        sv,
        cliente,
        dataFabricacao: dataFabricacao || "",
        dataRegistro,
        responsavel
    };

    // Cria um novo registro no Firebase
    const dbRef = firebase.database().ref('ferramentais');
    const newKey = dbRef.push().key;
    dbRef.child(newKey).set(novoFerramental)
    .then(() => {
        alert("Ferramental registrado com sucesso!");
        // Limpa campos
        document.getElementById('tipo').value = "";
        document.getElementById('sv').value = "";
        document.getElementById('cliente').value = "";
        document.getElementById('dataFabricacao').value = "";
        document.getElementById('dataRegistro').value = "";
        document.getElementById('responsavel').value = "";
    })
    .catch(err => {
        alert("Erro ao registrar: " + err.message);
    });
});
</script>

</body>
</html>
