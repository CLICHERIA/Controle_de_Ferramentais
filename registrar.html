<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar - SGF</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .logo-container {
      margin: 40px auto;
      filter: drop-shadow(0 0 8px #00eaff);
      display: inline-block;
    }

    img.logo {
      width: 200px;
    }

    form {
      background-color: #0d1b2a;
      display: inline-block;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00eaff22;
      text-align: left;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
      border: none;
    }

    .neon-button {
      margin-top: 15px;
      padding: 12px;
      font-weight: bold;
      color: #00eaff;
      background-color: #0d1b2a;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
      transition: 0.3s ease-in-out;
    }

    .neon-button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff;
    }

    .button-group {
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
  </div>

  <h2 style="color:#00eaff;">Registrar Ferramental</h2>

  <form id="registrarForm">
    <label for="tipo">Tipo de Ferramental</label>
    <select id="tipo" required>
      <option value="">Selecione</option>
      <option value="faca">Faca</option>
      <option value="cliche">Clichê</option>
    </select>

    <label for="sv">SV</label>
    <input type="text" id="sv" placeholder="SV" required>

    <label for="cliente">Cliente</label>
    <input type="text" id="cliente" placeholder="Cliente" required>

    <label for="dataFabricacao">Data de Fabricação</label>
    <input type="date" id="dataFabricacao">

    <label for="dataRegistro">Data de Registro no Sistema</label>
    <input type="date" id="dataRegistro" required>

    <label for="responsavel">Responsável pelo Registro</label>
    <input type="text" id="responsavel" placeholder="Nome do responsável" required>

    <div class="button-group">
      <button type="submit" class="neon-button">Registrar</button>
      <a href="menu.html" class="neon-button">Menu Principal</a>
    </div>
  </form>

</body>
</html>
