<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ferramenta</title>

<style>
body {
    background-color: #0a0f1a;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    margin:0; padding:0;
}

h1 { text-align:center; color:#00eaff; text-shadow:0 0 20px #00eaff; margin-top:20px; }

form {
    display:flex; flex-direction:column; align-items:center;
    background:#0d1b2a;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 20px #00eaff33;
    margin:30px auto;
    width:90%;
    max-width:400px;
}

input, textarea {
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #00eaff;
    background-color:#0a0f1a;
    color:#00eaff;
}

input::placeholder, textarea::placeholder { color:#66d9ff; }

button {
    padding:12px 20px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background-color:#0d1b2a;
    color:#00eaff;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 5px #00eaff,0 0 10px #00eaff,0 0 20px #00eaff;
    transition:0.3s ease-in-out;
}

button:hover {
    color:#00ffff;
    box-shadow:0 0 10px #00eaff,0 0 20px #00eaff,0 0 30px #00eaff;
}

.error { color:#ff5555; margin-top:10px; }
</style>
</head>
<body>

<h1>Registrar Ferramenta</h1>

<form id="formRegistrar">
    <input type="text" id="nome" placeholder="Nome da Ferramenta" required>
    <input type="text" id="codigo" placeholder="Código/QR Code" required>
    <textarea id="descricao" placeholder="Descrição" rows="3"></textarea>
    <button type="submit">Registrar</button>
    <div id="erro" class="error"></div>
</form>

<script type="module">
  // Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("formRegistrar");
  const erro = document.getElementById("erro");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const codigo = document.getElementById("codigo").value;
    const descricao = document.getElementById("descricao").value;

    try {
        await addDoc(collection(db, "ferramentas"), { nome, codigo, descricao });
        alert("Ferramenta registrada com sucesso!");
        form.reset();
    } catch(err) {
        erro.textContent = "Erro ao registrar: " + err.message;
    }
  });
</script>

</body>
</html>
