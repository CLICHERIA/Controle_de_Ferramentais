<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Ferramental — Grupo Sovel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #0e1620;
      --text-primary: #e6eef6;
      --text-muted: #99a3ad;
      --accent-primary: #1e88e5;
      --accent-secondary: #0ea5a4;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    form {
      background: var(--bg-secondary);
      padding: 2.5rem;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: 500;
      color: var(--text-primary);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      border-radius: var(--border-radius);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: rgba(8, 22, 27, 0.8);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(30,136,229,0.15);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      color: #021018;
      font-weight: 600;
      padding: 1rem;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: var(--transition);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .back-link {
      margin-top: 1.5rem;
      color: var(--accent-primary);
      text-decoration: none;
      transition: var(--transition);
      font-weight: 500;
      text-align: center;
      display: block;
    }

    .back-link:hover {
      color: var(--accent-secondary);
      text-decoration: underline;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 2rem 0 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Registrar Ferramental</h1>
    <p>Preencha as informações abaixo para cadastrar um novo item.</p>
  </header>

  <form id="formFerramental">
    <label for="codigo">Código do Ferramental</label>
    <input type="text" id="codigo" placeholder="Ex: CL-2025-001" required />

    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Ex: Molde de Clichê" required />

    <label for="descricao">Descrição</label>
    <textarea id="descricao" placeholder="Breve descrição do ferramental"></textarea>

    <label for="local">Local</label>
    <input type="text" id="local" placeholder="Ex: Almoxarifado / Setor Clicheria" required />

    <label for="status">Status</label>
    <select id="status" required>
      <option value="">Selecione...</option>
      <option value="Em uso">Em uso</option>
      <option value="Em manutenção">Em manutenção</option>
      <option value="Disponível">Disponível</option>
    </select>

    <button type="submit">Salvar Registro</button>
    <a href="menu.html" class="back-link">← Voltar ao Menu</a>
  </form>

  <footer>© 2025 Grupo Sovel da Amazônia</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("formFerramental");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const codigo = document.getElementById("codigo").value.trim();
      const nome = document.getElementById("nome").value.trim();
      const descricao = document.getElementById("descricao").value.trim();
      const local = document.getElementById("local").value.trim();
      const status = document.getElementById("status").value;

      if (!codigo || !nome || !local || !status) {
        alert("Preencha todos os campos obrigatórios!");
        return;
      }

      try {
        await addDoc(collection(db, "ferramentais"), {
          codigo,
          nome,
          descricao,
          local,
          status,
          criadoEm: serverTimestamp(),
        });

        alert("Ferramental registrado com sucesso!");
        form.reset();
      } catch (error) {
        console.error("Erro ao salvar:", error);
        alert("Erro ao registrar: " + error.message);
      }
    });
  </script>
</body>
</html>
