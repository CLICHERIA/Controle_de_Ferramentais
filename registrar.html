<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ferramental</title>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_AUTH_DOMAIN",
    projectId: "SEU_PROJECT_ID",
    storageBucket: "SEU_STORAGE_BUCKET",
    messagingSenderId: "SEU_MSG_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  setPersistence(auth, browserLocalPersistence);

  onAuthStateChanged(auth, user => {
    if(!user){
      window.location.href = "index.html";
    } else {
      document.getElementById('nomeUsuario').textContent = user.displayName || user.email;
      document.getElementById('funcaoUsuario').textContent = "Operador D.A.C";
    }
  });
</script>

<style>
  body { background:#0a0f1a; color:#fff; font-family:'Segoe UI',sans-serif; margin:0; padding:0;}
  .logo-container{ text-align:center; margin-top:30px; filter: drop-shadow(0 0 8px #00eaff);}
  img.logo{ width:200px;}
  .centralizado{ max-width:800px; margin:30px auto; text-align:center;}
  label{ display:block; margin:15px 0 5px; color:#00eaff;}
  input, select{ width:100%; padding:10px; border-radius:8px; border:none; background:#0d1b2a; color:#fff; box-shadow:0 0 10px #00eaff22;}
  .neon-button{ padding:12px 30px; margin:10px; background:#0d1b2a; color:#00eaff; font-weight:bold; border-radius:10px; text-decoration:none; display:inline-block; box-shadow:0 0 5px #00eaff,0 0 10px #00eaff; transition:0.3s;}
  .neon-button:hover{ color:#00ffff; box-shadow:0 0 20px #00eaff;}
  .top-right{ position:absolute; top:15px; right:20px; text-align:right; color:#00eaff; font-weight:bold;}
</style>
</head>
<body>

<div class="top-right">
  Nome: <span id="nomeUsuario"></span><br>
  Função: <span id="funcaoUsuario"></span>
</div>

<div class="logo-container">
  <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
</div>

<div class="centralizado">
  <h2>Registrar Ferramental</h2>
  <form id="formRegistrar">
    <label>Tipo de Ferramental</label>
    <select id="tipoFerramental" required>
      <option value="">Selecione</option>
      <option value="Faca">Faca</option>
      <option value="Clichê">Clichê</option>
    </select>

    <label>SV</label>
    <input type="text" id="sv" placeholder="Ex: F123" required>

    <label>Cliente</label>
    <input type="text" id="cliente" placeholder="Nome do Cliente" required>

    <label>Data de Fabricação</label>
    <input type="date" id="dataFabricacao">

    <label>Data de Registro</label>
    <input type="date" id="dataRegistro" required>

    <label>Responsável pelo Registro</label>
    <input type="text" id="responsavel" placeholder="Seu nome" required>

    <button type="submit" class="neon-button">Registrar</button>
    <a href="menu.html" class="neon-button">Voltar ao Menu</a>
  </form>
</div>

<script>
  document.getElementById('formRegistrar').addEventListener('submit', e=>{
    e.preventDefault();
    alert("Ferramental registrado com sucesso!");
    document.getElementById('formRegistrar').reset();
  });
</script>

</body>
</html>
