<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Registrar Ferramental</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center;}
.centralizado { width:90%; max-width:600px; margin:30px auto; background:#222; padding:20px; border-radius:10px;}
input, select { width:80%; margin:10px 0; padding:8px; border-radius:5px; border:none;}
button { padding:8px 15px; border:none; border-radius:5px; background:#00bfff; color:#111; font-weight:bold; cursor:pointer; margin:5px;}
button:hover { background:#00e0ff; }
img.logo { width:120px; margin-bottom:20px; display:block; margin-left:auto; margin-right:auto; }
</style>
</head>
<body>

<div class="centralizado">
    <img src="logosovel1337.png" alt="Logo" class="logo">
    <h2>Registrar Ferramental</h2>

    <label>Tipo de Ferramental:</label>
    <select id="tipo">
        <option value="">Selecione</option>
        <option value="Faca">Faca</option>
        <option value="Clichê">Clichê</option>
    </select><br>

    <input type="text" id="sv" placeholder="SV (letra e número)"><br>
    <input type="text" id="cliente" placeholder="Cliente"><br>
    <input type="date" id="dataFabricacao" placeholder="Data de Fabricação"><br>
    <input type="date" id="dataRegistro" placeholder="Data de Registro"><br>
    <input type="text" id="responsavel" placeholder="Responsável pelo registro"><br>

    <button id="btnRegistrar">Registrar</button>
    <button onclick="window.location.href='menu.html'">Menu Principal</button>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
firebase.initializeApp(firebaseConfig);

// Checa se usuário está logado
firebase.auth().onAuthStateChanged(user => {
    if (!user) {
        alert("Faça login primeiro!");
        window.location.href = "index.html";
        return;
    }

    const dbRef = firebase.database().ref('ferramentais');

    document.getElementById('btnRegistrar').onclick = () => {
        const tipo = document.getElementById('tipo').value;
        const sv = document.getElementById('sv').value.trim();
        const cliente = document.getElementById('cliente').value.trim();
        const dataFabricacao = document.getElementById('dataFabricacao').value;
        const dataRegistro = document.getElementById('dataRegistro').value;
        const responsavel = document.getElementById('responsavel').value.trim();

        if (!tipo || !sv || !cliente || !responsavel) {
            alert("Preencha todos os campos obrigatórios (Tipo, SV, Cliente, Responsável)");
            return;
        }

        const novoFerramental = {
            tipo,
            sv,
            cliente,
            dataFabricacao: dataFabricacao || "",
            dataRegistro: dataRegistro || "",
            responsavel
        };

        dbRef.push(novoFerramental)
        .then(() => {
            alert("Ferramental registrado com sucesso!");
            // Limpa campos
            document.getElementById('tipo').value = "";
            document.getElementById('sv').value = "";
            document.getElementById('cliente').value = "";
            document.getElementById('dataFabricacao').value = "";
            document.getElementById('dataRegistro').value = "";
            document.getElementById('responsavel').value = "";
        })
        .catch(err => alert("Erro ao registrar: " + err.message));
    };
});
</script>

</body>
</html>
