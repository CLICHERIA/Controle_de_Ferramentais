<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ferramental</title>
  <style>
    body {
      background-color: #0a0f1a;
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a {
      color: #00eaff;
      text-decoration: none;
    }

    .logo-container {
      margin-top: 40px;
      text-align: center;
    }

    img.logo {
      width: 200px;
      filter: drop-shadow(0 0 8px #00eaff);
    }

    h1 {
      color: #00eaff;
      text-shadow: 0 0 20px #00eaff;
      text-align: center;
      margin: 20px 0;
    }

    form {
      background-color: #0d1b2a;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #00eaff33;
      max-width: 500px;
      width: 90%;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #00eaff;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00eaff44;
      background-color: #0a0f1a;
      color: #ffffff;
      font-size: 14px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #0d1b2a;
      color: #00eaff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow:
        0 0 5px #00eaff,
        0 0 10px #00eaff,
        0 0 20px #00eaff;
      transition: 0.3s ease-in-out;
    }

    button:hover {
      color: #00ffff;
      box-shadow:
        0 0 10px #00eaff,
        0 0 20px #00eaff,
        0 0 30px #00eaff;
    }
  </style>
</head>
<body>

<div class="logo-container">
  <img src="logosovel1337.png" alt="Logo Grupo Sovel da Amazônia" class="logo">
</div>

<h1>Registrar Ferramental</h1>

<form id="formRegistrar">
  <label for="tipo">Tipo de Ferramental</label>
  <select id="tipo" required>
    <option value="">Selecione</option>
    <option value="faca">Faca</option>
    <option value="cliche">Clichê</option>
  </select>

  <label for="sv">SV</label>
  <input type="text" id="sv" placeholder="Ex: F123" required>

  <label for="cliente">Cliente</label>
  <input type="text" id="cliente" placeholder="Nome do Cliente" required>

  <label for="dataFab">Data de Fabricação</label>
  <input type="date" id="dataFab">

  <label for="dataRegistro">Data de Registro no Sistema</label>
  <input type="date" id="dataRegistro" required>

  <label for="responsavel">Responsável pelo Registro</label>
  <input type="text" id="responsavel" placeholder="Seu nome" required>

  <button type="submit">Registrar</button>
</form>

<script>
  const form = document.getElementById('formRegistrar');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Ferramental registrado com sucesso!');
  });
</script>

</body>
</html>
