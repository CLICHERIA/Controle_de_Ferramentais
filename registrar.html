<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ferramental</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Orbitron', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #00f0ff;
  }

  .form-box {
    background: rgba(0,0,0,0.85);
    padding: 3rem;
    border-radius: 12px;
    box-shadow: 0 0 20px #00f0ff, 0 0 40px #ff00ff inset;
    width: 350px;
    text-align: center;
  }

  h1 {
    margin-bottom: 2rem;
    text-shadow: 0 0 10px #00f0ff, 0 0 20px #ff00ff;
  }

  input, button {
    width: 100%;
    padding: 0.8rem;
    margin: 0.8rem 0;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
    font-weight: bold;
  }

  input {
    background: rgba(0,0,0,0.3);
    color: #00f0ff;
    border: 1px solid #00f0ff;
  }

  button {
    background: linear-gradient(90deg, #00f0ff, #ff00ff);
    color: #fff;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    box-shadow: 0 0 20px #ff00ff, 0 0 40px #00f0ff;
  }
</style>
</head>
<body>

<div class="form-box">
  <h1>Registrar Ferramental</h1>
  <input type="text" id="nome" placeholder="Nome do Ferramental">
  <input type="text" id="codigo" placeholder="Código">
  <button id="btnRegistrar">Registrar</button>
  <button id="btnVoltar">Voltar</button>
</div>

<script>
  document.getElementById("btnVoltar").addEventListener("click", () => {
    window.location.href = "menu.html";
  });

  document.getElementById("btnRegistrar").addEventListener("click", () => {
    const nome = document.getElementById("nome").value;
    const codigo = document.getElementById("codigo").value;
    alert(`Ferramental "${nome}" com código "${codigo}" registrado!`);
    document.getElementById("nome").value = "";
    document.getElementById("codigo").value = "";
  });
</script>

</body>
</html>
