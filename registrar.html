<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ferramental</title>

  <!-- ====================== -->
  <!-- Estilo futurista do README -->
  <!-- ====================== -->
  <style>
    body {
      background-color: #0a0f1a;
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding-top: 40px;
    }

    .form-box {
      background: #0d1b2a;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 0 20px #00eaff55;
      width: 400px;
      text-align: center;
    }

    .logo-container {
      display: inline-block;
      background: transparent;
      padding: 0;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 8px #00eaff);
    }

    .logo-container img {
      width: 180px;
      display: block;
      margin: 0 auto;
    }

    input, select {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border-radius: 5px;
      border: 1px solid #00eaff44;
      background-color: #0a0f1a;
      color: #00eaff;
      font-size: 1rem;
    }

    input::placeholder {
      color: #00eaff88;
    }

    label {
      display: block;
      text-align: left;
      color: #00eaff;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .neon-button {
      display: inline-block;
      padding: 12px 25px;
      color: #00eaff;
      font-weight: bold;
      border-radius: 10px;
      background-color: #0d1b2a;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 40px #00eaff55;
      cursor: pointer;
      transition: 0.3s ease-in-out;
      text-decoration: none;
      font-size: 16px;
      margin-top: 10px;
    }

    .neon-button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff, 0 0 50px #00eaff77;
    }
  </style>
</head>
<body>

<div class="logo-container" style="text-align:center; margin-top:20px;">
  <img src="../logosovel1337.png" alt="Logo Grupo Sovel da Amazônia" width="200" class="logo" />
</div>


  <h2>Registrar Ferramental</h2>

  <form id="formRegistrar">
    <label for="tipo">Tipo de Ferramental *</label>
    <select id="tipo" required>
      <option value="">Selecione</option>
      <option value="faca">Faca</option>
      <option value="cliche">Clichê</option>
    </select>

    <label for="sv">SV *</label>
    <input type="text" id="sv" placeholder="Ex: A123" required>

    <label for="cliente">Cliente *</label>
    <input type="text" id="cliente" placeholder="Nome do cliente" required>

    <label for="dataFabricacao">Data de Fabricação</label>
    <input type="date" id="dataFabricacao">

    <label for="dataRegistro">Data de Registro no Sistema *</label>
    <input type="date" id="dataRegistro" required>

    <label for="responsavel">Responsável pelo Registro *</label>
    <input type="text" id="responsavel" placeholder="Nome do responsável" required>

    <button type="submit" class="neon-button">Registrar</button>
  </form>
</div>

<script>
  document.getElementById('formRegistrar').addEventListener('submit', function(e){
    e.preventDefault();

    const tipo = document.getElementById('tipo').value;
    const sv = document.getElementById('sv').value;
    const cliente = document.getElementById('cliente').value;
    const dataFabricacao = document.getElementById('dataFabricacao').value;
    const dataRegistro = document.getElementById('dataRegistro').value;
    const responsavel = document.getElementById('responsavel').value;

    // Aqui você pode adicionar a lógica para enviar os dados ao Firebase ou outro backend
    console.log({
      tipo,
      sv,
      cliente,
      dataFabricacao,
      dataRegistro,
      responsavel
    });

    alert('Ferramental registrado com sucesso!');
    // Resetando formulário
    this.reset();
  });
</script>

</body>
</html>
