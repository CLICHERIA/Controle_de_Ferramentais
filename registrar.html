<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Registrar Ferramental</title>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}
.centralizado {
  width:90%;
  max-width:600px;
  margin:30px auto;
  background:#222;
  padding:20px;
  border-radius:10px;
  box-shadow:0 0 15px #00bfff33;
}
input, select {
  width:80%;
  margin:10px 0;
  padding:8px;
  border-radius:5px;
  border:none;
}
button {
  padding:8px 15px;
  border:none;
  border-radius:5px;
  background:#00bfff;
  color:#111;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
  transition:0.3s;
}
button:hover {
  background:#00e0ff;
}
img.logo {
  width:120px;
  margin-bottom:20px;
  display:block;
  margin-left:auto;
  margin-right:auto;
}
</style>
</head>
<body>

<div class="centralizado">
  <img src="logosovel1337.png" alt="Logo" class="logo">
  <h2>Registrar Ferramental</h2>

  <label>Tipo de Ferramental:</label><br>
  <select id="tipo">
    <option value="">Selecione</option>
    <option value="Faca">Faca</option>
    <option value="Clichê">Clichê</option>
  </select><br>

  <input type="text" id="nfe" placeholder="Nº da NF-e (opcional, ex: 0176/1-3, 0176/2-3)"><br>
  <input type="text" id="sv" placeholder="SV (letra e número)" required><br>
  <input type="text" id="nome" placeholder="Nome (ex: kit caixa natalino sovel CX02 - preto)" required><br>

  <input type="date" id="dataRegistro" placeholder="Data de Registro (obrigatória)"><br>

  <label>Estado:</label><br>
  <select id="estado">
    <option value="">Selecione</option>
    <option value="Em uso">Em uso</option>
    <option value="Danificada">Danificada</option>
    <option value="Em manutenção">Em manutenção</option>
    <option value="Para substituir">Para substituir</option>
  </select><br>

  <input type="text" id="localizacao" placeholder="Localização (ex: Armário 1, fileira 2, posição 3)"><br>

  <input type="text" id="responsavel" placeholder="Responsável pelo registro" readonly><br>

  <button id="btnRegistrar">Registrar</button>
  <button onclick="window.location.href='menu.html'">Menu Principal</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
};
firebase.initializeApp(firebaseConfig);

// Verifica autenticação
firebase.auth().onAuthStateChanged(user => {
  if (!user) {
    alert("Faça login primeiro!");
    window.location.href = "index.html";
    return;
  }

  document.getElementById('responsavel').value = user.email;
  const dbRef = firebase.database().ref('ferramentais');

  document.getElementById('btnRegistrar').onclick = () => {
    const tipo = document.getElementById('tipo').value;
    const nfe = document.getElementById('nfe').value.trim();
    const sv = document.getElementById('sv').value.trim();
    const nome = document.getElementById('nome').value.trim();
    let dataRegistro = document.getElementById('dataRegistro').value;
    const estado = document.getElementById('estado').value;
    const localizacao = document.getElementById('localizacao').value.trim();
    const responsavel = document.getElementById('responsavel').value;

    if (!tipo || !sv || !nome || !estado || !localizacao) {
      alert("Preencha todos os campos obrigatórios (Tipo, SV, Nome, Estado, Localização).");
      return;
    }

    // Gera data/hora atual se não for informada
    if (!dataRegistro) {
      const agora = new Date();
      const dia = String(agora.getDate()).padStart(2, '0');
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const ano = agora.getFullYear();
      const hora = String(agora.getHours()).padStart(2, '0');
      const minuto = String(agora.getMinutes()).padStart(2, '0');
      const segundo = String(agora.getSeconds()).padStart(2, '0');
      dataRegistro = `${dia}/${mes}/${ano} ${hora}:${minuto}:${segundo}`;
    }

    // Divide múltiplas NF-es, se houver
    const nfeList = nfe ? nfe.split(",").map(n => n.trim()).filter(n => n !== "") : [""];

    const promessas = nfeList.map(numeroNF => {
      const novoFerramental = {
        tipo,
        nfe: numeroNF,
        sv,
        nome,
        dataRegistro,
        estado,
        localizacao,
        responsavel
      };
      return dbRef.push(novoFerramental);
    });

    Promise.all(promessas)
      .then(() => {
        alert("Ferramental registrado com sucesso!");
        document.getElementById('tipo').value = "";
        document.getElementById('nfe').value = "";
        document.getElementById('sv').value = "";
        document.getElementById('nome').value = "";
        document.getElementById('dataRegistro').value = "";
        document.getElementById('estado').value = "";
        document.getElementById('localizacao').value = "";
      })
      .catch(err => alert("Erro ao registrar: " + err.message));
  };
});
</script>

</body>
</html>
