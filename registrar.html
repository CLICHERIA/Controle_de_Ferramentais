<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ferramental - SGF</title>
  <style>
    body {
      background-color: #0a0f1a;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      color: #00eaff;
      text-shadow: 0 0 5px #00eaff;
    }
    input, button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      margin: 5px 0;
      width: 300px;
    }
    button {
      cursor: pointer;
      font-weight: bold;
      color: #00eaff;
      background-color: #0d1b2a;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff;
      transition: 0.3s;
    }
    button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Registrar Ferramental</h1>

  <input type="text" id="tipo" placeholder="Tipo">
  <input type="text" id="nfe" placeholder="NF-e">
  <input type="text" id="sv" placeholder="SV">
  <input type="text" id="nome" placeholder="Nome">
  <input type="text" id="dataRegistro" placeholder="Data de Registro">
  <input type="text" id="estado" placeholder="Estado">
  <input type="text" id="localizacao" placeholder="Localização">
  <input type="text" id="responsavel" placeholder="Responsável">

  <div class="btn-group">
    <button id="btnRegistrar">Registrar</button>
    <button id="btnVoltarMenu">Voltar ao Menu</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
      authDomain: "dacsovel-53481.firebaseapp.com",
      databaseURL: "https://dacsovel-53481-default-rtdb.firebaseio.com",
      projectId: "dacsovel-53481",
      storageBucket: "dacsovel-53481.appspot.com",
      messagingSenderId: "37867522513",
      appId: "1:37867522513:web:336d687e3fc8408bd138f0",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const btnVoltar = document.getElementById("btnVoltarMenu");
    btnVoltar.onclick = () => window.location.href = "menu.html";

    document.getElementById("btnRegistrar").onclick = async () => {
      const tipo = document.getElementById("tipo").value;
      const nfe = document.getElementById("nfe").value;
      const sv = document.getElementById("sv").value;
      const nome = document.getElementById("nome").value;
      const dataRegistro = document.getElementById("dataRegistro").value;
      const estado = document.getElementById("estado").value;
      const localizacao = document.getElementById("localizacao").value;
      const responsavel = document.getElementById("responsavel").value;

      if (!tipo || !sv || !nome) {
        alert("Preencha pelo menos Tipo, SV e Nome!");
        return;
      }

      try {
        await push(ref(db, "ferramentais"), {
          tipo, nfe, sv, nome, dataRegistro, estado, localizacao, responsavel
        });
        alert("Ferramental registrado com sucesso!");
        window.location.href = "consultar.html";
      } catch (error) {
        console.error(error);
        alert("Erro ao registrar ferramental!");
      }
    };
  </script>
</body>
</html>
