<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ferramental</title>

<style>
body {
    background-color: #0a0f1a;
    margin: 0; padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
}
h1 { color: #00eaff; text-shadow: 0 0 20px #00eaff; margin-top: 40px; }
form { display: flex; flex-direction: column; width: 300px; margin-top: 30px; }
input { padding: 0.8rem; margin-bottom: 1rem; border-radius: 5px; border: 1px solid #00eaff; background: #0d1b2a; color: #00eaff; }
input::placeholder { color: #66d9ff; }
button { padding: 1rem; background-color: #0d1b2a; color: #00eaff; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 0 5px #00eaff,0 0 10px #00eaff; transition: 0.3s; }
button:hover { color: #00ffff; box-shadow: 0 0 10px #00eaff,0 0 20px #00eaff; }
.neon-button { margin-top: 20px; display: inline-block; text-align: center; }
</style>

</head>
<body>

<h1>🔧 Registrar Ferramental</h1>

<form id="formRegistrar">
  <input type="text" placeholder="Código do Ferramental" required>
  <input type="text" placeholder="Descrição" required>
  <input type="text" placeholder="Localização" required>
  <button type="submit">Registrar</button>
</form>

<a href="menu.html" class="neon-button">Voltar ao Menu</a>

<script>
document.getElementById("formRegistrar").addEventListener("submit", (e) => {
    e.preventDefault();
    alert("Ferramental registrado com sucesso!");
});
</script>

</body>
</html>
