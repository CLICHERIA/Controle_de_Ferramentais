<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ferramental</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 2rem; background: #f5f5f5; }
    h1 { margin-bottom: 1rem; }
    form { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 400px; }
    input, select { padding: 0.8rem; font-size: 1rem; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 1rem; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
    .registrar { background: #28a745; color: #fff; }
    .voltar { background: #007BFF; color: #fff; margin-top: 1rem; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

<h1>Registrar Ferramental</h1>

<form id="formFerramental">
  <input type="text" id="nome" placeholder="Nome do Ferramental" required>
  <input type="text" id="codigo" placeholder="Código do Ferramental" required>
  <select id="status" required>
    <option value="">Selecione o Status</option>
    <option value="Disponível">Disponível</option>
    <option value="Em Uso">Em Uso</option>
    <option value="Manutenção">Manutenção</option>
  </select>
  <button class="registrar" type="submit">Registrar</button>
</form>

<button class="voltar" onclick="location.href='menu.html'">Voltar ao Menu</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, user => { if (!user) window.location.href = "index.html"; });

  const form = document.getElementById("formFerramental");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const codigo = document.getElementById("codigo").value;
    const status = document.getElementById("status").value;

    try {
      await addDoc(collection(db, "ferramentais"), { nome, codigo, status, criadoEm: new Date() });
      alert("Ferramental registrado com sucesso!");
      form.reset();
    } catch (err) {
      alert("Erro: " + err.message);
    }
  });
</script>

</body>
</html>
