<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ferramental</title>
  <style>
    body {
      background-color: #0a0f1a;
      margin: 0;
      padding: 0;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    a {
      color: #00eaff;
      text-decoration: none;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 30px;
      filter: drop-shadow(0 0 8px #00eaff);
    }

    img.logo {
      display: block;
      max-width: 200px;
    }

    .centralizado {
      text-align: center;
      max-width: 600px;
      margin: 30px auto;
    }

    form {
      background: #0d1b2a;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 20px #00eaff44;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      color: #00eaff;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #00eaff55;
      background-color: #0a0f1a;
      color: #ffffff;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: none;
      border: 1px solid #00ffff;
      box-shadow: 0 0 10px #00eaff;
    }

    .botoes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background-color: #0d1b2a;
      color: #00eaff;
      box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
      transition: 0.3s ease-in-out;
    }

    button:hover {
      color: #00ffff;
      box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff;
    }

  </style>
</head>
<body>

  <div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel da Amazônia" class="logo">
  </div>

  <div class="centralizado">
    <h1 style="color:#00eaff; text-shadow:0 0 20px #00eaff;">Registrar Ferramental</h1>

    <form id="formRegistrar">
      <div>
        <label for="tipo">Tipo de Ferramental</label>
        <select id="tipo" required>
          <option value="">Selecione...</option>
          <option value="faca">Faca</option>
          <option value="cliche">Clichê</option>
        </select>
      </div>

      <div>
        <label for="sv">SV</label>
        <input type="text" id="sv" placeholder="Ex: A123" required>
      </div>

      <div>
        <label for="cliente">Cliente</label>
        <input type="text" id="cliente" placeholder="Nome do cliente" required>
      </div>

      <div>
        <label for="dataFabricacao">Data de Fabricação</label>
        <input type="date" id="dataFabricacao">
      </div>

      <div>
        <label for="dataRegistro">Data de Registro no Sistema</label>
        <input type="date" id="dataRegistro" required>
      </div>

      <div>
        <label for="responsavel">Responsável pelo Registro</label>
        <input type="text" id="responsavel" placeholder="Nome do responsável" required>
      </div>

      <div class="botoes">
        <button type="submit">Registrar</button>
        <button type="button" onclick="window.location.href='index.html'">Menu Principal</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('formRegistrar');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Ferramental registrado com sucesso!');
      form.reset();
    });
  </script>

</body>
</html>
