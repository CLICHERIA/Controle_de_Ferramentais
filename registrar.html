<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ferramental</title>

<!-- ====================== -->
<!-- Estilo Futurista -->
<!-- ====================== -->
<style>
  body {
    background-color: #0a0f1a;
    margin: 0;
    padding: 0;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
  }
  html, body { width: 100%; height: 100%; }
  a { color: #00eaff; text-decoration: none; }
  .logo-container { display: block; text-align: center; margin-top: 20px; filter: drop-shadow(0 0 8px #00eaff); }
  img.logo { max-width: 200px; }
  .centralizado { max-width: 600px; margin: 50px auto 0 auto; text-align: center; }
  input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: none; background: #0d1b2a; color: #00eaff; box-shadow: 0 0 10px #00eaff22; }
  button.neon-button { display: inline-block; padding: 10px 25px; color: #00eaff; font-weight: bold; border-radius: 10px; background-color: #0d1b2a; box-shadow: 0 0 10px #00eaff55; margin: 10px; cursor: pointer; transition: 0.3s; }
  button.neon-button:hover { color: #00ffff; box-shadow: 0 0 20px #00eaff77; }
  #painelUsuario { position: fixed; top: 10px; right: 10px; background-color: #0d1b2a; color: #00eaff; padding: 10px 15px; border-radius: 10px; font-size: 14px; text-align: right; box-shadow: 0 0 10px #00eaff44; }
</style>
</head>
<body>

<!-- ====================== -->
<!-- Painel do Usuário -->
<!-- ====================== -->
<div id="painelUsuario">
  <div>Nome: <span id="usuarioNome"></span></div>
  <div>Função: <span id="usuarioFuncao"></span></div>
  <div>Login: <span id="usuarioHoraLogin"></span></div>
  <div>Tempo Online: <span id="tempoOnline">00:00:00</span></div>
</div>

<!-- ====================== -->
<!-- Logo Centralizada -->
<!-- ====================== -->
<div class="logo-container">
  <img src="logosovel1337.png" alt="Logo Grupo Sovel" class="logo">
</div>

<!-- ====================== -->
<!-- Formulário -->
<!-- ====================== -->
<div class="centralizado">
  <h2 style="color:#00bfff; text-shadow:0 0 15px #00eaff;">📋 Registrar Ferramental</h2>
  
  <form id="formRegistrar">
    <label>Tipo de Ferramental</label>
    <select id="tipoFerramental" required>
      <option value="">Selecione</option>
      <option value="Faca">Faca</option>
      <option value="Clichê">Clichê</option>
    </select>

    <label>SV (Código)</label>
    <input type="text" id="svFerramental" placeholder="Ex: F123" required>

    <label>Cliente</label>
    <input type="text" id="clienteFerramental" placeholder="Nome do Cliente" required>

    <label>Data de Fabricação</label>
    <input type="date" id="dataFabricacao">

    <label>Data de Registro no Sistema</label>
    <input type="date" id="dataRegistro" required>

    <label>Responsável pelo Registro</label>
    <input type="text" id="responsavelRegistro" required>

    <div style="margin-top:20px;">
      <button type="submit" class="neon-button">Registrar</button>
      <button type="button" onclick="window.location.href='menu.html'" class="neon-button">Voltar ao Menu</button>
    </div>
  </form>
</div>

<!-- ====================== -->
<!-- Script Painel Usuário -->
<!-- ====================== -->
<script>
  function atualizarPainelUsuario() {
    const usuario = JSON.parse(localStorage.getItem('usuarioLogado'));
    if (!usuario) return;
    document.getElementById('usuarioNome').textContent = usuario.nome;
    document.getElementById('usuarioFuncao').textContent = usuario.funcao;
    const horaLogin = new Date(usuario.horaLogin);
    document.getElementById('usuarioHoraLogin').textContent = horaLogin.toLocaleString();
    setInterval(() => {
      const agora = new Date();
      const diff = Math.floor((agora - horaLogin) / 1000);
      const horas = String(Math.floor(diff / 3600)).padStart(2,'0');
      const minutos = String(Math.floor((diff%3600)/60)).padStart(2,'0');
      const segundos = String(diff%60).padStart(2,'0');
      document.getElementById('tempoOnline').textContent = `${horas}:${minutos}:${segundos}`;
    }, 1000);
  }
  atualizarPainelUsuario();

  // Simulação do submit
  document.getElementById('formRegistrar').addEventListener('submit', function(e){
    e.preventDefault();
    alert('Ferramental registrado com sucesso!');
    this.reset();
  });
</script>

</body>
</html>
