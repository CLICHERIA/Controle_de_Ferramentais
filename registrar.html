<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Ferramental — Grupo Sovel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #0e1620;
      --text-primary: #e6eef6;
      --text-muted: #99a3ad;
      --accent-primary: #1e88e5;
      --accent-secondary: #0ea5a4;
      --accent-hover: #0fb6c6;
      --border-radius: 12px;
      --transition: all 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-size: 1rem;
    }

    .form-container {
      background: var(--bg-secondary);
      padding: 2rem;
      border-radius: var(--border-radius);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .form-container input {
      width: 100%;
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background-color: rgba(8, 22, 27, 0.8);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    .form-container input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(30,136,229,0.15);
    }

    .form-container button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: #021018;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .form-container button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .back-link {
      margin-top: 2rem;
      color: var(--accent-primary);
      text-decoration: none;
      transition: var(--transition);
      font-weight: 500;
      text-align: center;
      display: block;
    }

    .back-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 2rem 0 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Registrar Ferramental</h1>
    <p>Preencha os campos abaixo para cadastrar um novo ferramental.</p>
  </header>

  <div class="form-container">
    <input type="text" id="codigo" placeholder="Código" required />
    <input type="text" id="nome" placeholder="Nome" required />
    <input type="text" id="status" placeholder="Status" required />
    <input type="text" id="local" placeholder="Local" required />
    <button id="registrarBtn">Registrar Ferramental</button>
  </div>

  <a href="menu.html" class="back-link">← Voltar ao Menu</a>

  <footer>© 2025 Grupo Sovel da Amazônia</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAMyXl5uWSWYNAy-qZBy3N3yU84mdS73w",
  authDomain: "dacsovel-53481.firebaseapp.com",
  projectId: "dacsovel-53481",
  storageBucket: "dacsovel-53481.firebasestorage.app",
  messagingSenderId: "37867522513",
  appId: "1:37867522513:web:336d687e3fc8408bd138f0",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const codigoInput = document.getElementById("codigo");
    const nomeInput = document.getElementById("nome");
    const statusInput = document.getElementById("status");
    const localInput = document.getElementById("local");
    const registrarBtn = document.getElementById("registrarBtn");

    registrarBtn.addEventListener("click", async () => {
      const codigo = codigoInput.value.trim();
      const nome = nomeInput.value.trim();
      const status = statusInput.value.trim();
      const local = localInput.value.trim();

      if (!codigo || !nome || !status || !local) {
        alert("Todos os campos são obrigatórios!");
        return;
      }

      try {
        await addDoc(collection(db, "ferramentais"), {
          codigo, nome, status, local
        });
        alert("Ferramental registrado com sucesso!");
        codigoInput.value = "";
        nomeInput.value = "";
        statusInput.value = "";
        localInput.value = "";
      } catch (error) {
        console.error(error);
        alert("Erro ao registrar ferramental.");
      }
    });
  </script>
</body>
</html>
