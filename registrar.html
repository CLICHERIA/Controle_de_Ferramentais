<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Ferramental</title>
<style>
  body {
    background-color: #0a0f1a;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 0;
    text-align: center;
  }
  .logo-container {
    margin-top: 30px;
    filter: drop-shadow(0 0 10px #00eaff);
  }
  .logo-container img {
    width: 150px;
  }
  form {
    margin-top: 40px;
    display: inline-block;
    text-align: left;
    background-color: #0d1b2a;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 20px #00eaff22;
  }
  label {
    display: block;
    margin-top: 15px;
    color: #00eaff;
  }
  input, select {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 5px;
    border: 1px solid #00eaff44;
    background-color: #0a0f1a;
    color: #00eaff;
  }
  button {
    margin-top: 20px;
    padding: 10px 25px;
    background-color: #0d1b2a;
    color: #00eaff;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 5px #00eaff, 0 0 10px #00eaff, 0 0 20px #00eaff;
  }
  button:hover {
    color: #00ffff;
    box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff, 0 0 30px #00eaff;
  }
  .button-row {
    display: flex;
    gap: 10px;
  }
</style>
</head>
<body>

  <div class="logo-container">
    <img src="logosovel1337.png" alt="Logo Grupo Sovel">
  </div>

  <h1 style="color:#00eaff; margin-top:20px;">Registrar Ferramental</h1>

  <form id="formRegistrar">
    <label>Tipo de Ferramental</label>
    <select id="tipo">
      <option value="Faca">Faca</option>
      <option value="Clichê">Clichê</option>
    </select>

    <label>SV</label>
    <input type="text" id="sv" required>

    <label>Cliente</label>
    <input type="text" id="cliente" required>

    <label>Data de Fabricação</label>
    <input type="date" id="dataFabricacao">

    <label>Data de Registro no Sistema</label>
    <input type="date" id="dataRegistro" required>

    <label>Responsável pelo Registro</label>
    <input type="text" id="responsavel" required>

    <div class="button-row">
      <button type="submit">Registrar</button>
      <a href="menu.html"><button type="button">Menu Principal</button></a>
    </div>
  </form>

  <script>
    document.getElementById('formRegistrar').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Ferramental registrado com sucesso!');
      document.getElementById('formRegistrar').reset();
    });
  </script>
</body>
</html>
